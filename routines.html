<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Routines">
<meta name="theme-color" content="#F4F2FA">
<title>Routines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F2FA;
    --card: #FFFFFF;
    --card-done: #F3F2F6;
    --text: #1D1B26;
    --muted: #77738A;
    --line: #E7E4EF;
    --accent: #7C6CF0;
    --accent-soft: #ECE8FF;
    --check: #1D1B26;
    --danger: #D9485F;
    --shadow: 0 1px 2px rgba(30, 20, 60, .05), 0 6px 20px rgba(30, 20, 60, .06);
    --c-yellow: #FFF1BF;
    --c-peach: #FDE3D3;
    --c-pink: #FFDDE7;
    --c-green: #D6F3DE;
    --c-blue: #D9EDFB;
    --c-lavender: #E9DFFF;
    --c-indigo: #DEDBFF;
    --c-grey: #EDEBF2;
    --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14131A;
      --card: #1F1D28;
      --card-done: #1A1922;
      --text: #F1EFF8;
      --muted: #9B97AD;
      --line: #2C2A37;
      --accent: #9D90FF;
      --accent-soft: #2C2747;
      --check: #F1EFF8;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
      --c-yellow: #4A3F1C;
      --c-peach: #4A2E22;
      --c-pink: #4D2633;
      --c-green: #1F3F2A;
      --c-blue: #1E3546;
      --c-lavender: #392D5A;
      --c-indigo: #2F2B5A;
      --c-grey: #2C2A37;
    }
  }
  .col-yellow { --cat: var(--c-yellow); }
  .col-peach { --cat: var(--c-peach); }
  .col-pink { --cat: var(--c-pink); }
  .col-green { --cat: var(--c-green); }
  .col-blue { --cat: var(--c-blue); }
  .col-lavender { --cat: var(--c-lavender); }
  .col-indigo { --cat: var(--c-indigo); }
  .col-grey { --cat: var(--c-grey); }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }
  body { overscroll-behavior-y: none; }
  body.noscroll { overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, select, textarea { font: inherit; color: inherit; }

  .app { max-width: 520px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 110px); }

  /* ---------- Header ---------- */
  .title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 8px 6px 4px; }
  .day-name { font-family: var(--serif); font-weight: 500; font-size: 38px; letter-spacing: -.01em; line-height: 1.05; }
  .day-caption { color: var(--muted); font-size: 14px; margin-top: 4px; display: flex; gap: 8px; align-items: center; }
  .today-pill { font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--accent); padding: 3px 10px; border-radius: 99px; }
  .top-actions { display: flex; align-items: center; gap: 2px; margin-top: 8px; }
  .month-btn { font-size: 14px; font-weight: 600; letter-spacing: .06em; padding: 8px 10px; border-radius: 10px; display: flex; align-items: center; gap: 6px; }
  .month-btn svg { transition: transform .2s; }
  .month-btn.open svg { transform: rotate(180deg); }
  .icon-btn { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; }
  .icon-btn:hover, .month-btn:hover { background: var(--accent-soft); }

  /* Week strip */
  .calendar { margin: 14px 0 6px; user-select: none; -webkit-user-select: none; touch-action: pan-y; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .wday { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0 8px; border-radius: 16px; transition: background .15s; }
  .wday .l { font-size: 12px; color: var(--muted); font-weight: 500; }
  .wday .n { font-size: 21px; color: var(--muted); font-weight: 400; }
  .wday.today .n, .wday.today .l { color: var(--accent); font-weight: 600; }
  .wday.sel { background: var(--card); box-shadow: var(--shadow); }
  .wday.sel .n { color: var(--text); }
  .wday .dot { width: 6px; height: 6px; border-radius: 50%; }
  .dot.full { background: var(--accent); }
  .dot.part { border: 1.5px solid var(--accent); }
  .dot.none { background: transparent; }
  .dot.future { background: var(--line); }

  /* Month grid */
  .month { background: var(--card); border-radius: 22px; padding: 14px 12px 12px; box-shadow: var(--shadow); }
  .month-head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 10px; }
  .month-head h3 { font-family: var(--serif); font-weight: 500; font-size: 20px; }
  .mgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .mgrid .h { font-size: 11px; color: var(--muted); font-weight: 600; padding-bottom: 4px; }
  .mcell { aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; position: relative; font-size: 14px; }
  .mcell:hover { background: var(--accent-soft); }
  .mcell .ring { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
  .mcell .ring span { width: 28px; height: 28px; border-radius: 50%; background: var(--card); display: grid; place-items: center; }
  .mcell.today { color: var(--accent); font-weight: 700; }
  .mcell.sel .ring span { background: var(--text); color: var(--card); font-weight: 600; }
  .mcell.other { visibility: hidden; }

  /* Progress */
  .progress { display: flex; align-items: center; gap: 10px; padding: 8px 6px 2px; color: var(--muted); font-size: 13px; }
  .bar { flex: 1; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #A79BFF, var(--accent)); border-radius: 99px; transition: width .4s; }

  /* ---------- Category sections ---------- */
  .section { margin-top: 22px; }
  .sec-row { display: flex; align-items: center; gap: 4px; margin: 0 0 10px 2px; }
  .sec-head { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 99px; font-weight: 600; font-size: 14px;
              letter-spacing: .08em; text-transform: uppercase; background: var(--cat, var(--c-grey)); max-width: calc(100% - 46px); }
  .sec-head .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sec-head .em { font-size: 16px; letter-spacing: 0; }
  .sec-head .info-dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid currentColor; font-size: 11px; display: grid; place-items: center;
                        letter-spacing: 0; text-transform: none; font-weight: 700; opacity: .6; flex: none; }
  .sec-toggle svg { transition: transform .2s; color: var(--muted); }
  .section.collapsed .sec-toggle svg { transform: rotate(-90deg); }
  .section.collapsed .task-list { display: none; }

  .task-list { list-style: none; background: var(--card); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; min-height: 8px; }
  .nothing { margin-top: 22px; padding: 26px 20px; text-align: center; color: var(--muted); background: var(--card); border-radius: 20px; box-shadow: var(--shadow); }

  .task { display: flex; align-items: center; gap: 14px; padding: 12px 16px 12px 14px; position: relative; cursor: pointer;
          user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-y; background: var(--card); transition: background .2s; }
  .task + .task { border-top: 1px solid var(--line); }
  .task.done { background: var(--card-done); }
  .task.done .t-title { color: var(--muted); }
  .task.skipped { opacity: .5; }
  .task.placeholder { background: var(--accent-soft); }
  .task.placeholder > * { visibility: hidden; }
  .task.ghost { position: fixed; z-index: 50; pointer-events: none; border-radius: 18px; box-shadow: 0 12px 40px rgba(40, 20, 90, .25); transform: scale(1.03); border: 0 !important; }

  .icon-wrap { position: relative; width: 46px; height: 46px; flex: none; display: grid; place-items: center; }
  .icon-wrap .emoji { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; background: var(--cat, var(--c-grey)); }
  .icon-wrap svg.ring { position: absolute; inset: 0; transform: rotate(-90deg); }
  .icon-wrap svg.ring circle { fill: none; stroke-width: 3; }
  .icon-wrap svg.ring .trk { stroke: var(--line); }
  .icon-wrap svg.ring .val { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .5s; }

  .info { flex: 1; min-width: 0; }
  .t-title { font-weight: 600; font-size: 16px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-sub { color: var(--muted); font-size: 14px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .t-sub .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .badge.warn { background: #FFE9D6; color: #B4561A; }
  @media (prefers-color-scheme: dark) { .badge.warn { background: #4A2E18; color: #FFB27A; } }

  .check { width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center; position: relative; }
  .check .c { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--check); display: grid; place-items: center; transition: background .15s, transform .15s; }
  .check .c svg { opacity: 0; transform: scale(.4); transition: all .2s; }
  .done .check .c { background: var(--check); }
  .done .check .c svg { opacity: 1; transform: scale(1); }
  .check:active .c { transform: scale(.88); }
  .burst { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); left: 50%; top: 50%; pointer-events: none; animation: burst .6s ease-out forwards; }
  @keyframes burst { from { transform: translate(-50%,-50%) scale(1); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.3); opacity: 0; } }

  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 22px; line-height: 1.6; }
  .hint button { color: var(--accent); font-weight: 600; font-size: 12px; }

  /* Empty state */
  .welcome { text-align: center; padding: 40px 20px; background: var(--card); border-radius: 24px; margin-top: 22px; box-shadow: var(--shadow); }
  .welcome .big { font-size: 48px; }
  .welcome h2 { font-family: var(--serif); font-weight: 500; font-size: 26px; margin: 10px 0 8px; }
  .welcome p { color: var(--muted); line-height: 1.5; margin-bottom: 20px; }
  .welcome .btns { display: flex; flex-direction: column; gap: 10px; }

  /* Buttons */
  .btn { padding: 13px 18px; border-radius: 14px; font-weight: 600; background: var(--accent-soft); color: var(--accent); text-align: center; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: transparent; color: var(--muted); }
  .btn.danger { background: transparent; color: var(--danger); }
  .btn:active { transform: scale(.98); }

  .fab { position: fixed; right: max(20px, calc(50% - 240px)); bottom: calc(env(safe-area-inset-bottom) + 24px); width: 60px; height: 60px; border-radius: 50%;
         background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: 0 10px 30px rgba(124, 108, 240, .45); z-index: 20; }
  .fab:active { transform: scale(.94); }

  /* ---------- Sheet ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(20, 15, 40, .35); z-index: 100; display: flex; align-items: flex-end; justify-content: center;
             opacity: 0; pointer-events: none; transition: opacity .2s; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 26px 26px 0 0;
           padding: 10px 20px calc(env(safe-area-inset-bottom) + 24px); transform: translateY(30px); transition: transform .25s; overscroll-behavior: contain; }
  .overlay.open .sheet { transform: none; }
  @media (min-width: 640px) { .overlay { align-items: center; } .sheet { border-radius: 26px; max-height: 86vh; } }
  .grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 14px; }
  .sheet h2 { font-family: var(--serif); font-weight: 500; font-size: 26px; }
  .sheet-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; }
  .card { background: var(--card); border-radius: 18px; padding: 4px 16px; box-shadow: var(--shadow); margin-bottom: 14px; }

  .detail-head { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; }
  .detail-head .emoji { width: 64px; height: 64px; border-radius: 50%; background: var(--cat, var(--c-grey)); display: grid; place-items: center; font-size: 32px; flex: none; }
  .detail-head p { color: var(--muted); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip { background: var(--card); padding: 6px 12px; border-radius: 99px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow); }
  button.chip { color: var(--accent); }
  .notice { background: #FFF1E3; color: #8A4A17; border-radius: 14px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px; line-height: 1.45; }
  @media (prefers-color-scheme: dark) { .notice { background: #3A2A1B; color: #FFC898; } }
  .label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 4px 8px; }

  .notes { padding: 12px 0; line-height: 1.5; font-size: 15px; }
  .notes h4 { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
  .notes h4:first-child { margin-top: 2px; }
  .notes p { margin: 4px 0; }
  .notes ul { margin: 4px 0 4px 2px; list-style: none; }
  .notes li { position: relative; padding-left: 16px; margin: 5px 0; }
  .notes li::before { content: ''; position: absolute; left: 2px; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  .cl-item { display: flex; align-items: center; gap: 12px; padding: 11px 0; }
  .cl-item + .cl-item { border-top: 1px solid var(--line); }
  .cl-item .box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--check); display: grid; place-items: center; flex: none; }
  .cl-item.on .box { background: var(--check); }
  .cl-item.on .box svg { opacity: 1; }
  .cl-item .box svg { opacity: 0; }
  .cl-item.on span { text-decoration: line-through; color: var(--muted); }
  .cl-item span { flex: 1; }
  .cl-item .x { color: var(--muted); font-size: 18px; padding: 0 4px; }
  .cl-add { display: flex; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
  .cl-add input { flex: 1; border: 0; background: transparent; outline: none; padding: 4px 0; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .actions .wide { grid-column: 1 / -1; }

  /* Form */
  .field { display: block; margin-bottom: 14px; }
  .field > span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 4px 6px; }
  .input, .field input, .field select, .field textarea, .pair select { width: 100%; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); outline: none; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { min-height: 84px; resize: vertical; line-height: 1.4; }
  .field textarea.tall { min-height: 220px; }
  .title-field { display: flex; gap: 10px; margin-bottom: 10px; }
  .title-field .emoji-input { width: 58px; text-align: center; font-size: 24px; padding: 8px; flex: none; }
  .title-field input[name="title"] { flex: 1; font-size: 17px; font-weight: 600; }
  .emoji-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 16px; }
  .emoji-grid button { width: 38px; height: 38px; border-radius: 10px; font-size: 20px; }
  .emoji-grid button:hover { background: var(--accent-soft); }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 3px; }
  .seg label { text-align: center; padding: 9px 4px; border-radius: 11px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .seg input { display: none; }
  .seg label:has(input:checked) { background: var(--accent); color: #fff; }
  .daychips { display: flex; gap: 6px; margin: -4px 0 14px; }
  .daychips label { flex: 1; text-align: center; padding: 10px 0; border-radius: 12px; background: var(--card); border: 1.5px solid var(--line); font-weight: 600; font-size: 13px; cursor: pointer; }
  .daychips input { display: none; }
  .daychips label:has(input:checked) { background: var(--accent); color: #fff; border-color: var(--accent); }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatches label { width: 38px; height: 38px; border-radius: 50%; background: var(--cat); cursor: pointer; border: 2px solid var(--line); }
  .swatches input { display: none; }
  .swatches label:has(input:checked) { border: 3px solid var(--accent); }
  .toggle { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--card); border-radius: 14px; border: 1.5px solid var(--line); margin-bottom: 14px; cursor: pointer; }
  .toggle input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
  .toggle small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  [hidden] { display: none !important; }

  /* Library & lists */
  .lib-group { margin-bottom: 8px; }
  .lib-head { display: flex; justify-content: space-between; align-items: center; margin: 18px 4px 8px; }
  .lib-head h3 { font-size: 16px; }
  .lib-head p { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .lib-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .lib-row + .lib-row { border-top: 1px solid var(--line); }
  .lib-row .emoji { width: 36px; height: 36px; border-radius: 50%; background: var(--cat, var(--c-grey)); display: grid; place-items: center; font-size: 18px; flex: none; }
  .lib-row .info small { color: var(--muted); font-size: 13px; }
  .lib-row.click, .lib-row .click { cursor: pointer; }
  .add-btn { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 20px; font-weight: 600; flex: none; display: grid; place-items: center; }
  .add-btn.added { background: transparent; color: var(--muted); font-size: 16px; }
  .small-btn { font-size: 13px; font-weight: 600; color: var(--accent); padding: 6px 10px; border-radius: 10px; background: var(--accent-soft); white-space: nowrap; }
  .mv { width: 30px; height: 30px; border-radius: 9px; color: var(--muted); display: grid; place-items: center; flex: none; }
  .mv:hover { background: var(--accent-soft); }
  .mv:disabled { opacity: .25; cursor: default; }

  .menu-item { display: flex; align-items: center; gap: 14px; padding: 15px 2px; width: 100%; text-align: left; font-weight: 500; }
  .menu-item + .menu-item { border-top: 1px solid var(--line); }
  .menu-item .mi { font-size: 20px; width: 28px; text-align: center; }
  .menu-item.danger { color: var(--danger); }
  .footnote { color: var(--muted); font-size: 13px; line-height: 1.5; padding: 4px 4px 0; }

  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 100px); transform: translate(-50%, 20px); background: var(--text); color: var(--bg);
           padding: 12px 18px; border-radius: 14px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: all .25s; z-index: 200; max-width: 90vw; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-row">
      <div>
        <h1 class="day-name" id="dayName"></h1>
        <div class="day-caption" id="dayCaption"></div>
      </div>
      <div class="top-actions">
        <button class="month-btn" id="monthBtn"></button>
        <button class="icon-btn" id="menuBtn" aria-label="Menu and settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        </button>
      </div>
    </div>
    <div class="calendar" id="calendar"></div>
    <div class="progress" id="progress"></div>
  </header>
  <main id="list"></main>
</div>

<button class="fab" id="addBtn" aria-label="Add task">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

/* =========================================================
   Date helpers (dates are local 'YYYY-MM-DD' strings)
   ========================================================= */
const pad = n => String(n).padStart(2, '0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };
const todayStr = () => fmt(new Date());
const dow = s => parse(s).getDay();
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const weekStart = s => addDays(s, -((dow(s) + 6) % 7));
const monthStart = s => s.slice(0, 8) + '01';
const shortDay = s => parse(s).toLocaleDateString(undefined, { weekday: 'short' });
const dayName = (d, style = 'long') => new Date(2024, 0, 7 + d).toLocaleDateString(undefined, { weekday: style }); // 7 Jan 2024 = Sunday
const ordinal = n => n + (['th','st','nd','rd'][(n % 100 - 20) % 10] || ['th','st','nd','rd'][n % 100] || 'th');

const clone = o => JSON.parse(JSON.stringify(o));
const byOrder = (a, b) => a.order - b.order;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function makeTask(src) {
  return {
    id: uid(),
    title: src.title,
    emoji: src.emoji || '✨',
    category: src.category || 'other',
    time: src.time || '',

    start: src.start || (src.cadence && src.cadence.type === 'once' ? src.cadence.date : todayStr()),
    rollover: src.rollover !== undefined ? src.rollover : true,
    checklist: (src.checklist || []).map(text => typeof text === 'string' ? { id: uid(), text } : text),
    notes: src.notes || '',
    order: 0,
    created: Date.now()

function migrate(s) {
  if (!Array.isArray(s.categories) || !s.categories.length) {
    s.categories = defaultCategories();
    // v1 used fixed categories + a morning/day/evening section on each task
    const map = { morning: 'morning-routine', night: 'night-routine', groceries: 'groceries', lifestyle: 'lifestyle', home: 'chores', other: 'other' };
    s.tasks = (s.tasks || []).filter(t => !(t.category === 'skincare' && /^(Morning|Evening) skincare$/.test(t.title)));
    for (const t of s.tasks) {
      if (t.category === 'skincare') t.category = t.section === 'morning' ? 'am-skin' : 'pm-skin';
      else t.category = map[t.category] || 'other';
      delete t.section;
    }
  }
  if (!s.seededSkincare) {
    let order = s.tasks.length ? Math.max(...s.tasks.map(t => t.order || 0)) + 1 : 0;
    for (const item of skincareSeed()) {
      const cat = s.categories.find(c => c.id === item.category);
      const t = makeTask(Object.assign({
        cadence: cat ? cat.cadence : C.daily,
        rollover: cat ? cat.rollover : false
      }, item));
      t.order = order++;
      s.tasks.push(t);
    }
    s.seededSkincare = true;
  }
  s.version = 2;
  [...s.tasks].sort(byOrder).forEach((t, i) => { t.order = i; });
  return s;
}

function load() {

  } catch (e) { console.warn('Could not load saved data', e); }
  s = migrate(s);
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { /* ignore */ }
  return s;
}

const taskById = id => state.tasks.find(t => t.id === id);

function orderedCategories() {

/* =========================================================
   Scheduling
   ========================================================= */
function isScheduled(t, ds) {
  const c = t.cadence;
  if (c.type === 'once') return ds === c.date;
  if (ds < t.start) return false;
  switch (c.type) {
    case 'daily': return true;
    case 'weekdays': { const w = dow(ds); return w > 0 && w < 6; }
    case 'weekly': return (c.days || []).includes(dow(ds));
    case 'interval': return diffDays(t.start, ds) % Math.max(1, c.every || 1) === 0;
    case 'monthly': {
      const d = parse(ds);
      const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      return d.getDate() === Math.min(c.day || 1, dim);
    }
    case 'nth': {
      const d = parse(ds);
      if (d.getDay() !== c.weekday) return false;
      const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      return c.n === -1 ? d.getDate() + 7 > dim : Math.ceil(d.getDate() / 7) === c.n;
    }
  }
  return false;
}

function lastScheduledBefore(t, ds) {
  if (t.cadence.type === 'once') return t.cadence.date < ds ? t.cadence.date : null;
  let d = addDays(ds, -1);
  for (let i = 0; i < 400 && d >= t.start; i++) {
    if (isScheduled(t, d)) return d;
    d = addDays(d, -1);
  }
  return null;
}

/* Everything that should appear on a given day, in the user's global order.
   An unfinished occurrence carries forward day by day (up to today) until it's
   done, skipped, or the task's next scheduled occurrence takes over. */
function occurrencesFor(ds) {
  const t0 = todayStr();
  const out = [];
  for (const t of state.tasks) {
    if (isScheduled(t, ds)) {
      const k = key(t.id, ds);
      out.push({ task: t, occ: ds, key: k, carried: false, done: !!state.done[k], skipped: !!state.skips[k] });
    } else if (t.rollover && ds <= t0) {
      const s = lastScheduledBefore(t, ds);
      if (!s) continue;
      const k = key(t.id, s);
      if (state.skips[k]) continue;
      const d = state.done[k];
      if (d && d.on < ds) continue;
      out.push({ task: t, occ: s, key: k, carried: true, done: !!d && d.on === ds, skipped: false });
    }
  }
  return out.sort((a, b) => byOrder(a.task, b.task));
}

function dayStats(ds) {
  const occ = occurrencesFor(ds).filter(o => !o.skipped);
  return { total: occ.length, done: occ.filter(o => o.done).length };
}

function streak(t) {
  if (t.cadence.type === 'once') return 0;
  const t0 = todayStr();
  let d = t0, n = 0;
  for (let i = 0; i < 730 && d >= t.start; i++, d = addDays(d, -1)) {
    if (!isScheduled(t, d)) continue;
    const k = key(t.id, d);
    if (state.done[k]) n++;
    else if (state.skips[k] || d === t0) continue;
    else break;
  }
  return n;
}

function cadenceText(c) {
  switch (c.type) {
    case 'once': return c.date ? 'Once · ' + parse(c.date).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }) : 'One-off';
    case 'daily': return 'Every day';
    case 'weekdays': return 'Weekdays';
    case 'weekly': {
      const days = WEEK_ORDER.filter(d => (c.days || []).includes(d));
      if (days.length === 7) return 'Every day';
      return 'Every ' + (days.map(d => dayName(d, 'short')).join(', ') || '—');
    }
    case 'interval': return c.every === 1 ? 'Every day' : `Every ${c.every} days`;
    case 'monthly': return `Monthly on the ${ordinal(c.day)}`;
    case 'nth': return `${NTH[c.n]} ${dayName(c.weekday)} of the month`;
  }
  return '';
}

/* Light formatting for notes: "* " / "- " lines become bullets, a line that
   introduces a list (or ends with ":") becomes a heading. */
function renderNotes(text) {
  const lines = String(text || '').split('\n');
  const isBullet = l => /^\s*([*\-•])\s+/.test(l);
  let html = '', inList = false;
  lines.forEach((raw, i) => {
    const l = raw.trim();
    if (isBullet(l)) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${esc(l.replace(/^([*\-•])\s+/, ''))}</li>`;
      return;
    }
    if (inList) { html += '</ul>'; inList = false; }
    if (!l) return;
    const next = (lines[i + 1] || '').trim();
    if (isBullet(next) || /:$/.test(l)) html += `<h4>${esc(l.replace(/:$/, ''))}</h4>`;
    else html += `<p>${esc(l)}</p>`;
  });
  if (inList) html += '</ul>';
  return html;
}

/* =========================================================
   Mutations
   ========================================================= */
function normaliseOrder() {
  [...state.tasks].sort(byOrder).forEach((t, i) => { t.order = i; });
}

/* Place a task in a sensible default spot within its category: before the first
   task with a later start time, otherwise at the end of the category. */
function placeByDefault(task) {
  const others = state.tasks.filter(t => t !== task).sort(byOrder);
  const same = others.filter(t => t.category === task.category);
  let idx = others.length;
  const later = task.time ? same.find(t => t.time && t.time > task.time) : null;
  if (later) idx = others.indexOf(later);
  else if (same.length) idx = others.indexOf(same[same.length - 1]) + 1;
  others.splice(idx, 0, task);
  others.forEach((t, i) => { t.order = i; });
  if (!state.tasks.includes(task)) state.tasks.push(task);
}

function moveTask(id, catId, prevId, nextId) {
  const t = taskById(id);
  if (!t) return;
  if (catId) t.category = catId;
  const all = state.tasks.filter(x => x !== t).sort(byOrder);
  let idx = all.length;
  if (prevId) idx = all.findIndex(x => x.id === prevId) + 1;
  else if (nextId) idx = all.findIndex(x => x.id === nextId);
  if (idx < 0) idx = all.length;
  all.splice(idx, 0, t);
  all.forEach((x, i) => { x.order = i; });
  save();
}

function setDone(o, on) {
  if (on) {
    state.done[o.key] = { on: ui.date, at: Date.now() };
    delete state.skips[o.key];
    delete state.timers[o.key];
  } else {
    delete state.done[o.key];
  }
  save();
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(t => t.id !== id);
  for (const bag of [state.done, state.skips, state.checks, state.timers])
    for (const k of Object.keys(bag)) if (k.startsWith(id + '|')) delete bag[k];
  normaliseOrder();
  save();
}

/* =========================================================
   Rendering
   ========================================================= */
const $ = sel => document.querySelector(sel);
const listEl = $('#list');

function render() {
  renderHeader();
  renderCalendar();
  renderList();
}

function renderHeader() {
  const d = parse(ui.date);
  const isToday = ui.date === todayStr();
  $('#dayName').textContent = d.toLocaleDateString(undefined, { weekday: 'long' });
  $('#dayCaption').innerHTML = esc(d.toLocaleDateString(undefined, { day: 'numeric', month: 'long' })) +
    (isToday ? '<span class="today-pill">Today</span>' : '<button class="today-pill" data-action="today">Back to today</button>');
  const mb = $('#monthBtn');
  mb.innerHTML = esc(d.toLocaleDateString(undefined, { month: 'short', year: 'numeric' }).toUpperCase()) + ICONS.chev;
  mb.classList.toggle('open', ui.monthOpen);
}

function dotClass(ds) {
  const s = dayStats(ds);
  if (!s.total) return 'none';
  if (ds > todayStr()) return 'future';
  return s.done === s.total ? 'full' : 'part';
}

function renderCalendar() {
  const cal = $('#calendar');
  const t0 = todayStr();
  if (!ui.monthOpen) {
    const ws = weekStart(ui.date);
    let html = '<div class="week">';
    for (let i = 0; i < 7; i++) {
      const ds = addDays(ws, i);
      const cls = ['wday', ds === ui.date && 'sel', ds === t0 && 'today'].filter(Boolean).join(' ');
      html += `<button class="${cls}" data-date="${ds}"><span class="l">${WEEKDAY_LETTERS[dow(ds)]}</span><span class="n">${parse(ds).getDate()}</span><span class="dot ${dotClass(ds)}"></span></button>`;
    }
    cal.innerHTML = html + '</div>';
    return;
  }
  const ms = ui.monthCursor;
  const first = parse(ms);
  const dim = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7;
  let html = `<div class="month"><div class="month-head">
      <button class="icon-btn" data-action="prev-month" aria-label="Previous month">${ICONS.left}</button>
      <h3>${esc(first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }))}</h3>
      <button class="icon-btn" data-action="next-month" aria-label="Next month">${ICONS.right}</button>
    </div><div class="mgrid">`;
  html += WEEK_ORDER.map(d => `<div class="h">${WEEKDAY_LETTERS[d]}</div>`).join('');
  for (let i = 0; i < lead; i++) html += '<div class="mcell other"></div>';
  for (let day = 1; day <= dim; day++) {
    const ds = ms.slice(0, 8) + pad(day);
    const s = dayStats(ds);
    let ring = 'transparent';
    if (s.total && ds <= t0) ring = `conic-gradient(var(--accent) ${Math.round(s.done / s.total * 100)}%, var(--line) 0)`;
    else if (s.total) ring = 'var(--line)';
    const cls = ['mcell', ds === ui.date && 'sel', ds === t0 && 'today'].filter(Boolean).join(' ');
    html += `<button class="${cls}" data-date="${ds}" aria-label="${ds}"><span class="ring" style="background:${ring}"><span>${day}</span></span></button>`;
  }
  cal.innerHTML = html + '</div></div>';
}

function subtitle(o) {
  const t = o.task;
  const parts = [];
  const tm = state.timers[o.key];
  if (tm && !o.done && t.duration) {
    const left = Math.ceil((t.duration * 60000 - (Date.now() - tm.start)) / 60000);
    parts.push(left > 0 ? `${left} min left` : 'Time’s up');
  } else if (t.time && t.endTime) parts.push(`${t.time} → ${t.endTime}`);
  else if (t.time && t.duration) parts.push(`${t.time} · ${t.duration} min`);
  else if (t.time) parts.push(t.time);
  else if (t.duration) parts.push(`${t.duration} min`);
  if (t.checklist && t.checklist.length) {
    const c = state.checks[o.key] || {};
    parts.push(`${t.checklist.filter(i => c[i.id]).length}/${t.checklist.length} items`);
  }
  if (!parts.length && t.notes) parts.push(t.notes.split('\n')[0]);
  let html = parts.length ? `<span class="txt">${esc(parts.join(' · '))}</span>` : '';
  if (o.carried) html += `<span class="badge warn">↻ from ${esc(shortDay(o.occ))}</span>`;
  if (o.skipped) html += '<span class="badge">Skipped</span>';
  return html;
}

function ringSvg(o) {
  const tm = state.timers[o.key];
  if (!tm || o.done || !o.task.duration) return '';
  const r = 21.5, c = 2 * Math.PI * r;
  const p = Math.min(1, (Date.now() - tm.start) / (o.task.duration * 60000));
  return `<svg class="ring" width="46" height="46" viewBox="0 0 46 46"><circle class="trk" cx="23" cy="23" r="${r}"/><circle class="val" cx="23" cy="23" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}"/></svg>`;
}

function taskRow(o) {
  const t = o.task;
  const cls = ['task', o.done && 'done', o.skipped && 'skipped', o.carried && 'carried'].filter(Boolean).join(' ');
  return `<li class="${cls}" data-id="${t.id}">
      <div class="icon-wrap">${ringSvg(o)}<span class="emoji">${esc(t.emoji)}</span></div>
      <div class="info"><div class="t-title">${esc(t.title)}</div><div class="t-sub">${subtitle(o)}</div></div>
      <button class="check" aria-label="${o.done ? 'Mark not done' : 'Mark done'}"><span class="c">${ICONS.tick}</span></button>
    </li>`;
}

function renderList() {
  const occ = occurrencesFor(ui.date);
  const counted = occ.filter(o => !o.skipped);
  const done = counted.filter(o => o.done).length;

  $('#progress').innerHTML = counted.length
    ? `<div class="bar"><i style="width:${Math.round(done / counted.length * 100)}%"></i></div><span>${done} of ${counted.length} done</span>`
    : '';

  if (!state.tasks.length) {
    listEl.innerHTML = `<div class="welcome">
        <div class="big">🌱</div>
        <h2>Build your routines</h2>
        <p>Start with a ready-made morning and night routine, browse the library, or add your own tasks.</p>
        <div class="btns">
          <button class="btn primary" data-action="starter">Add morning &amp; night routines</button>
          <button class="btn" data-action="library">Browse routine library</button>
          <button class="btn ghost" data-action="add">Add my own task</button>
        </div></div>`;
    return;
  }

  let html = '';
  for (const cat of orderedCategories()) {
    const items = occ.filter(o => catOf(o.task).id === cat.id);
    if (!items.length) continue;
    const collapsed = !!state.collapsed[cat.id];
    html += `<section class="section col-${cat.color}${collapsed ? ' collapsed' : ''}" data-cat="${cat.id}">
      <div class="sec-row">
        <button class="sec-head" data-action="cat-info" data-cat="${cat.id}" aria-label="${esc(cat.name)}: rules and notes">
          <span class="em">${esc(cat.emoji)}</span><span class="nm">${esc(cat.name)}</span><span>(${items.length})</span>${cat.notes ? '<span class="info-dot">i</span>' : ''}
        </button>
        <button class="icon-btn sec-toggle" data-action="collapse" data-cat="${cat.id}" aria-label="${collapsed ? 'Expand' : 'Collapse'}">${ICONS.chev}</button>
      </div>
      <ul class="task-list" data-cat="${cat.id}">${items.map(taskRow).join('')}</ul></section>`;
  }
  if (!html) html = '<div class="nothing">Nothing planned for this day 🌤️</div>';
  html += `<p class="hint">Tap a heading for its rules &amp; notes · tap a task for details · press and hold to reorder<br>
    <button data-action="library">Routine library</button> · <button data-action="categories">Categories</button></p>`;
  listEl.innerHTML = html;
}

/* =========================================================
   Interactions: list
   ========================================================= */
function findOcc(id, ds = ui.date) {
  return occurrencesFor(ds).find(o => o.task.id === id);
}

function burst(el) {
  for (let i = 0; i < 8; i++) {
    const s = document.createElement('span');
    const a = (Math.PI * 2 * i) / 8;
    s.className = 'burst';
    s.style.setProperty('--dx', Math.cos(a) * 26 + 'px');
    s.style.setProperty('--dy', Math.sin(a) * 26 + 'px');
    el.appendChild(s);
    setTimeout(() => s.remove(), 650);
  }
}

let suppressClick = false;

document.addEventListener('click', e => {
  const actionEl = e.target.closest('[data-action]');
  if (actionEl && !actionEl.closest('#sheet')) {
    const a = actionEl.dataset.action;
    if (a === 'today') goTo(todayStr());
    if (a === 'collapse') { const c = actionEl.dataset.cat; state.collapsed[c] = !state.collapsed[c]; save(); renderList(); }
    if (a === 'cat-info') openCategory(actionEl.dataset.cat);
    if (a === 'starter') addFromLibrary(['morning', 'night']);
    if (a === 'library') openLibrary();
    if (a === 'categories') openCategories();
    if (a === 'add') openForm();
    if (a === 'prev-month' || a === 'next-month') {
      const d = parse(ui.monthCursor); d.setMonth(d.getMonth() + (a === 'next-month' ? 1 : -1));
      ui.monthCursor = fmt(d); renderCalendar();
    }
    return;
  }
  const dateEl = e.target.closest('[data-date]');
  if (dateEl && dateEl.closest('#calendar')) {
    const wasMonth = ui.monthOpen;
    ui.monthOpen = false;
    goTo(dateEl.dataset.date);
    if (wasMonth) window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  const row = e.target.closest('.task');
  if (row && row.closest('#list')) {
    if (suppressClick) return;
    const o = findOcc(row.dataset.id);
    if (!o) return;
    if (e.target.closest('.check')) {
      setDone(o, !o.done);
      if (!o.done) {
        burst(e.target.closest('.check'));
        if (navigator.vibrate) navigator.vibrate(12);
      }
      row.classList.toggle('done', !o.done);
      setTimeout(render, o.done ? 0 : 350);
    } else {
      openDetail(o.task.id);
    }
  }
});

function goTo(ds) {
  ui.date = ds;
  ui.monthCursor = monthStart(ds);
  render();
}

$('#monthBtn').addEventListener('click', () => {
  ui.monthOpen = !ui.monthOpen;
  ui.monthCursor = monthStart(ui.date);
  render();
});
$('#menuBtn').addEventListener('click', openMenu);
$('#addBtn').addEventListener('click', () => openForm());

/* Swipe the week strip / month to move through time */
(() => {
  const cal = $('#calendar');
  let sx = 0, sy = 0, active = false;
  cal.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; active = true; }, { passive: true });
  cal.addEventListener('touchend', e => {
    if (!active) return; active = false;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
    const dir = dx < 0 ? 1 : -1;
    if (ui.monthOpen) {
      const d = parse(ui.monthCursor); d.setMonth(d.getMonth() + dir); ui.monthCursor = fmt(d); renderCalendar();
    } else goTo(addDays(ui.date, 7 * dir));
  });
})();

document.addEventListener('keydown', e => {
  if (ui.sheet) { if (e.key === 'Escape') closeSheet(); return; }
  if (e.target.matches('input, textarea, select')) return;
  if (e.key === 'ArrowLeft') goTo(addDays(ui.date, -1));
  if (e.key === 'ArrowRight') goTo(addDays(ui.date, 1));
  if (e.key === 't') goTo(todayStr());
  if (e.key === 'n') openForm();
});

/* =========================================================
   Drag to reorder (press & hold, works with mouse and touch)
   ========================================================= */
let pending = null, drag = null;

listEl.addEventListener('contextmenu', e => { if (e.target.closest('.task')) e.preventDefault(); });

listEl.addEventListener('pointerdown', e => {
  const row = e.target.closest('.task');
  if (!row || e.target.closest('.check') || (e.pointerType === 'mouse' && e.button !== 0)) return;
  pending = { row, x: e.clientX, y: e.clientY };
  pending.timer = setTimeout(() => { if (pending) startDrag(pending); }, 320);
});

document.addEventListener('pointermove', e => {
  if (drag) { e.preventDefault(); moveDrag(e.clientX, e.clientY); return; }
  if (pending && Math.hypot(e.clientX - pending.x, e.clientY - pending.y) > 8) cancelPending();
}, { passive: false });

document.addEventListener('pointerup', () => { if (drag) endDrag(); cancelPending(); });
document.addEventListener('pointercancel', () => { if (drag) endDrag(); cancelPending(); });
document.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, { passive: false });

function cancelPending() {
  if (pending) { clearTimeout(pending.timer); pending = null; }
}

function startDrag(p) {
  const row = p.row;
  const rect = row.getBoundingClientRect();
  const ghost = row.cloneNode(true);
  ghost.classList.add('ghost');
  const sec = row.closest('.section');
  if (sec) ghost.classList.add(...[...sec.classList].filter(c => c.startsWith('col-')));
  Object.assign(ghost.style, { left: rect.left + 'px', top: rect.top + 'px', width: rect.width + 'px' });
  document.body.appendChild(ghost);
  row.classList.add('placeholder');
  document.body.classList.add('dragging');
  drag = { row, ghost, offY: p.y - rect.top, lastY: p.y };
  pending = null;
  if (navigator.vibrate) navigator.vibrate(15);
  document.querySelectorAll('.section.collapsed').forEach(s => s.classList.remove('collapsed'));
  startAutoScroll();
}

function moveDrag(x, y) {
  drag.lastY = y;
  drag.ghost.style.top = (y - drag.offY) + 'px';
  const lists = [...listEl.querySelectorAll('.task-list')];
  let target = lists[0], best = Infinity;
  for (const l of lists) {
    const r = l.getBoundingClientRect();
    const dist = y < r.top ? r.top - y : y > r.bottom ? y - r.bottom : 0;
    if (dist < best) { best = dist; target = l; }
  }
  const rows = [...target.querySelectorAll('.task:not(.placeholder)')];
  const before = rows.find(r => { const b = r.getBoundingClientRect(); return y < b.top + b.height / 2; });
  if (before) target.insertBefore(drag.row, before); else target.appendChild(drag.row);
}

function startAutoScroll() {
  const step = () => {
    if (!drag) return;
    const y = drag.lastY, h = window.innerHeight, edge = 80;
    if (y < edge) window.scrollBy(0, -Math.ceil((edge - y) / 6));
    else if (y > h - edge) window.scrollBy(0, Math.ceil((y - (h - edge)) / 6));
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function endDrag() {
  const { row, ghost } = drag;
  const list = row.parentElement;
  const prev = row.previousElementSibling;
  const next = row.nextElementSibling;
  moveTask(row.dataset.id, list.dataset.cat, prev && prev.dataset.id, next && next.dataset.id);
  ghost.remove();
  document.body.classList.remove('dragging');
  drag = null;
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 50);
  render();
}

/* =========================================================
   Sheets
   ========================================================= */
const overlay = $('#overlay'), sheetEl = $('#sheet');

function openSheet(kind, html) {
  ui.sheet = kind;
  sheetEl.innerHTML = '<div class="grab"></div>' + html;
  if (!overlay.classList.contains('open')) {
    overlay.classList.add('open');
    document.body.classList.add('noscroll');
  }
  if (!kind.keepScroll) sheetEl.scrollTop = 0;
}
function closeSheet() {
  ui.sheet = null;
  overlay.classList.remove('open');
  document.body.classList.remove('noscroll');
}
overlay.addEventListener('click', e => { if (e.target === overlay) closeSheet(); });

/* ---------- Task detail ---------- */
function openDetail(id, keepScroll) {
  const o = findOcc(id);
  if (!o) { closeSheet(); return; }
  const t = o.task;
  const cat = catOf(t);
  const st = streak(t);
  const checks = state.checks[o.key] || {};
  const timer = state.timers[o.key];
  let html = `<div class="detail-head col-${cat.color}"><div class="emoji">${esc(t.emoji)}</div>
      <div><h2>${esc(t.title)}</h2><p>${subtitle(o)}</p></div></div>
    <div class="chips"><span class="chip">${esc(cadenceText(t.cadence))}</span>
      <button class="chip" data-action="open-cat" data-cat="${cat.id}">${esc(cat.emoji)} ${esc(cat.name)}${cat.notes ? ' · rules' : ''}</button>
      ${st ? `<span class="chip">🔥 ${st} in a row</span>` : ''}${t.rollover ? '<span class="chip">↻ Carries over</span>' : ''}</div>`;
  if (o.carried) {
    html += `<div class="notice">Carried over from ${esc(parse(o.occ).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }))} — it stays on your list until it's done or its next turn comes round.</div>`;
  }
  if (t.checklist.length || cat.id === 'groceries') {
    html += `<div class="label">Checklist</div><div class="card">` +
      t.checklist.map(i => `<div class="cl-item${checks[i.id] ? ' on' : ''}" data-action="check-item" data-item="${i.id}">
          <span class="box">${ICONS.tick}</span><span>${esc(i.text)}</span>
          <button class="x" data-action="remove-item" data-item="${i.id}" aria-label="Remove">×</button></div>`).join('') +
      `<form class="cl-add" data-form="add-item"><input name="item" placeholder="Add an item…" autocomplete="off"><button class="small-btn">Add</button></form></div>`;
  }
  if (t.notes) html += `<div class="label">Notes</div><div class="card"><div class="notes">${renderNotes(t.notes)}</div></div>`;
  html += '<div class="actions">';
  html += `<button class="btn primary wide" data-action="toggle-done">${o.done ? 'Mark as not done' : 'Mark as done'}</button>`;
  if (t.duration && !o.done) html += `<button class="btn wide" data-action="timer">${timer ? 'Stop timer' : `Start ${t.duration} min timer`}</button>`;
  if (!o.done) html += `<button class="btn" data-action="skip">${o.skipped ? 'Unskip' : 'Skip this time'}</button>`;
  html += `<button class="btn${o.done ? ' wide' : ''}" data-action="edit">Edit</button>`;
  html += `<button class="btn danger wide" data-action="delete">Delete task</button></div>`;
  openSheet({ type: 'detail', id, keepScroll }, html);
}

/* ---------- Shared repeat ("cadence") fields ---------- */
function cadenceFields(c, { allowDate = true } = {}) {
  const selDays = c.type === 'weekly' ? c.days : [dow(ui.date)];
  const opt = (v, l) => `<option value="${v}" ${c.type === v ? 'selected' : ''}>${l}</option>`;
  const nthN = c.type === 'nth' ? c.n : Math.min(4, Math.ceil(parse(ui.date).getDate() / 7));
  const nthDay = c.type === 'nth' ? c.weekday : dow(ui.date);
  const nthOpts = [1, 2, 3, 4, -1];
  return `<label class="field"><span>Repeat</span><select name="ctype">
      ${opt('daily', 'Every day')}${opt('weekdays', 'Weekdays (Mon–Fri)')}${opt('weekly', 'Weekly — pick the days')}
      ${opt('interval', 'Every few days')}${opt('monthly', 'Monthly — on a date')}${opt('nth', 'Monthly — e.g. first Monday')}
      ${opt('once', allowDate ? 'Just once' : 'One-off (no repeat)')}
    </select></label>
    <div class="daychips" data-show="weekly">
      ${WEEK_ORDER.map(d => `<label><input type="checkbox" name="days" value="${d}" ${selDays.includes(d) ? 'checked' : ''}>${WEEKDAY_LETTERS[d]}</label>`).join('')}
    </div>
    <label class="field" data-show="interval"><span>Every how many days?</span><input type="number" name="every" min="2" max="365" value="${c.every || 2}"></label>
    <label class="field" data-show="monthly"><span>Day of the month</span><input type="number" name="mday" min="1" max="31" value="${c.day || parse(ui.date).getDate()}"></label>
    <div class="pair" data-show="nth">
      <select name="nthN" aria-label="Which week">${nthOpts.map(n => `<option value="${n}" ${nthN === n ? 'selected' : ''}>${NTH[n]}</option>`).join('')}</select>
      <select name="nthDay" aria-label="Day">${WEEK_ORDER.map(d => `<option value="${d}" ${nthDay === d ? 'selected' : ''}>${dayName(d)}</option>`).join('')}</select>
    </div>
    ${allowDate ? `<label class="field" data-show="once"><span>Date</span><input type="date" name="date" value="${c.date || ui.date}"></label>` : ''}`;
}

function readCadence(fd) {
  const type = fd.get('ctype');
  const c = { type };
  if (type === 'weekly') {
    c.days = fd.getAll('days').map(Number);
    if (!c.days.length) { toast('Pick at least one day'); return null; }
  }
  if (type === 'interval') c.every = Math.max(2, parseInt(fd.get('every'), 10) || 2);
  if (type === 'monthly') c.day = Math.min(31, Math.max(1, parseInt(fd.get('mday'), 10) || 1));
  if (type === 'nth') { c.n = parseInt(fd.get('nthN'), 10); c.weekday = parseInt(fd.get('nthDay'), 10); }
  if (type === 'once' && fd.has('date')) c.date = fd.get('date') || ui.date;
  return c;
}

function setCadenceInputs(f, c) {
  f.ctype.value = c.type;
  if (c.type === 'weekly') f.querySelectorAll('[name=days]').forEach(i => { i.checked = c.days.includes(Number(i.value)); });
  if (c.type === 'interval') f.every.value = c.every;
  if (c.type === 'monthly') f.mday.value = c.day;
  if (c.type === 'nth') { f.nthN.value = String(c.n); f.nthDay.value = String(c.weekday); }
  updateCadenceFields(f);
}

function updateCadenceFields(f) {
  if (!f) return;
  const type = f.ctype.value;
  f.querySelectorAll('[data-show]').forEach(el => { el.hidden = el.dataset.show !== type; });
  f.querySelectorAll('[data-hide]').forEach(el => { el.hidden = el.dataset.hide === type; });
}

const emojiGrid = () => `<div class="emoji-grid">${EMOJIS.map(e => `<button type="button" data-action="pick-emoji" data-emoji="${e}">${e}</button>`).join('')}</div>`;

/* ---------- Task form ---------- */
function defaultCategoryId() {
  const h = new Date().getHours();
  if (h >= 12 && h < 17 && catById('other')) return 'other';
  const part = h < 12 ? 'morning' : 'evening';
  const c = orderedCategories().find(x => x.part === part && x.id !== 'am-skin' && x.id !== 'pm-skin') || state.categories[0];
  return c.id;
}

function openForm(id, presetCat) {
  const t = id ? taskById(id) : null;
  const cat = catById(presetCat) || catById(defaultCategoryId()) || state.categories[0];
  const v = t || {
    title: '', emoji: cat.emoji || '✨', category: cat.id,
    time: '', endTime: '', duration: '', cadence: clone(cat.cadence), start: ui.date,
    rollover: cat.rollover, checklist: [], notes: ''
  };
  const html = `<div class="sheet-top"><h2>${t ? 'Edit task' : 'New task'}</h2></div>
  <form data-form="task">
    <div class="title-field">
      <input class="input emoji-input" name="emoji" value="${esc(v.emoji)}" maxlength="8" aria-label="Icon">
      <input class="input" name="title" value="${esc(v.title)}" placeholder="What do you want to do?" required autocomplete="off">
    </div>
    ${emojiGrid()}

    <label class="field"><span>Category</span><select name="category">
      ${orderedCategories().map(c => `<option value="${c.id}" ${v.category === c.id ? 'selected' : ''}>${esc(c.emoji)} ${esc(c.name)}</option>`).join('')}
    </select></label>

    <div class="row3">
      <label class="field"><span>Start</span><input type="time" name="time" value="${esc(v.time)}"></label>
      <label class="field"><span>End</span><input type="time" name="endTime" value="${esc(v.endTime)}"></label>
      <label class="field"><span>Minutes</span><input type="number" name="duration" min="1" max="720" inputmode="numeric" value="${esc(v.duration || '')}" placeholder="—"></label>
    </div>

    ${cadenceFields(v.cadence)}
    <label class="field" data-hide="once"><span>Starting from</span><input type="date" name="start" value="${esc(v.start)}"></label>

    <label class="toggle"><input type="checkbox" name="rollover" ${v.rollover ? 'checked' : ''}>
      <div>Carry over if not done<small>Unfinished, it moves to the next day until you tick it off (or its next turn comes round).</small></div></label>

    <label class="field"><span>Checklist — one item per line</span>
      <textarea name="checklist" placeholder="Great for shopping lists or multi-step routines">${esc(v.checklist.map(i => i.text).join('\n'))}</textarea></label>
    <label class="field"><span>Notes</span><textarea name="notes" placeholder="Optional — the first line shows under the task">${esc(v.notes)}</textarea></label>

    <div class="actions">
      <button type="button" class="btn ghost" data-action="close">Cancel</button>
      <button type="submit" class="btn primary">${t ? 'Save' : 'Add task'}</button>
    </div>
  </form>`;
  openSheet({ type: 'form', id: id || null, touched: !!t }, html);
  updateCadenceFields(sheetEl.querySelector('form'));
  if (!t) setTimeout(() => { const i = sheetEl.querySelector('[name=title]'); if (i) i.focus(); }, 250);
}

function saveTaskForm(f) {
  const s = ui.sheet;
  const fd = new FormData(f);
  const title = String(fd.get('title') || '').trim();
  if (!title) { f.title.focus(); return; }
  const cadence = readCadence(fd);
  if (!cadence) return;

  const time = fd.get('time') || '';
  const endTime = fd.get('endTime') || '';
  let duration = parseInt(fd.get('duration'), 10) || null;
  if (!duration && time && endTime && endTime > time) {
    const [h1, m1] = time.split(':').map(Number), [h2, m2] = endTime.split(':').map(Number);
    duration = (h2 * 60 + m2) - (h1 * 60 + m1);
  }

  const existing = s.id ? taskById(s.id) : null;
  const oldItems = existing ? existing.checklist : [];
  const checklist = String(fd.get('checklist') || '').split('\n').map(x => x.trim()).filter(Boolean)
    .map(text => oldItems.find(i => i.text === text) || { id: uid(), text });

  const data = {
    title, emoji: String(fd.get('emoji') || '').trim() || '✨',
    category: fd.get('category'), time, endTime, duration, cadence,
    start: cadence.type === 'once' ? cadence.date : (fd.get('start') || ui.date),
    rollover: !!fd.get('rollover'), checklist, notes: String(fd.get('notes') || '').trim()
  };

  if (existing) {
    const catChanged = existing.category !== data.category;
    Object.assign(existing, data);
    if (catChanged) placeByDefault(existing);
    toast('Saved');
  } else {
    placeByDefault(makeTask(data));
    toast('Task added');
  }
  save();
  closeSheet();
  render();
}

/* ---------- Category: info sheet (tap a heading) ---------- */
function openCategory(id) {
  const c = catById(id);
  if (!c) return;
  const tasks = state.tasks.filter(t => catOf(t).id === c.id).sort(byOrder);
  let html = `<div class="detail-head col-${c.color}"><div class="emoji">${esc(c.emoji)}</div>
      <div><h2>${esc(c.name)}</h2><p>${esc(PARTS[partIdx(c.part)].label)} · new tasks default to: ${esc(cadenceText(c.cadence))}</p></div></div>`;
  html += `<div class="label">Rules &amp; notes</div>`;
  html += c.notes
    ? `<div class="card"><div class="notes">${renderNotes(c.notes)}</div></div>`
    : `<div class="card"><p class="footnote" style="padding:14px 0">No notes yet. Tap “Edit category” to add rules, reminders or anything you want to see here.</p></div>`;
  if (tasks.length) {
    html += `<div class="label">Steps (${tasks.length})</div><div class="card">` + tasks.map(t =>
      `<div class="lib-row click col-${c.color}" data-action="edit-task" data-id="${t.id}"><span class="emoji">${esc(t.emoji)}</span>
        <div class="info"><div>${esc(t.title)}</div><small>${esc(cadenceText(t.cadence))}${t.time ? ' · ' + esc(t.time) : ''}</small></div>
        <span class="footnote">Edit</span></div>`).join('') + '</div>';
  }
  html += `<div class="actions">
      <button class="btn primary" data-action="cat-add-task" data-cat="${c.id}">Add a task</button>
      <button class="btn" data-action="cat-edit" data-cat="${c.id}">Edit category</button></div>`;
  openSheet({ type: 'category', id }, html);
}

/* ---------- Category: settings list & form ---------- */
function openCategories() {
  const cats = orderedCategories();
  let html = `<div class="sheet-top"><h2>Categories</h2><button class="small-btn" data-action="close">Done</button></div>
    <p class="footnote" style="margin-bottom:12px">Each category has a part of the day, a default repeat for new tasks, and its own rules &amp; notes (shown when you tap its heading).</p>`;
  for (const p of PARTS) {
    const group = cats.filter(c => c.part === p.id);
    if (!group.length) continue;
    html += `<div class="label">${p.label}</div><div class="card">` + group.map((c, i) =>
      `<div class="lib-row col-${c.color}">
        <span class="emoji">${esc(c.emoji)}</span>
        <div class="info click" data-action="cat-edit" data-cat="${c.id}"><div>${esc(c.name)}</div>
          <small>${esc(cadenceText(c.cadence))}${c.rollover ? ' · carries over' : ''}${c.notes ? ' · has notes' : ''}</small></div>
        <button class="mv" data-action="cat-up" data-cat="${c.id}" ${i === 0 ? 'disabled' : ''} aria-label="Move up">${ICONS.up}</button>
        <button class="mv" data-action="cat-down" data-cat="${c.id}" ${i === group.length - 1 ? 'disabled' : ''} aria-label="Move down">${ICONS.down}</button>
      </div>`).join('') + '</div>';
  }
  html += `<div class="actions"><button class="btn primary wide" data-action="cat-new">New category</button></div>`;
  openSheet({ type: 'categories', keepScroll: !!(ui.sheet && ui.sheet.type === 'categories') }, html);
}

function moveCategory(id, dir) {
  const c = catById(id);
  const group = orderedCategories().filter(x => x.part === c.part);
  const i = group.indexOf(c), j = i + dir;
  if (j < 0 || j >= group.length) return;
  const a = state.categories.indexOf(c), b = state.categories.indexOf(group[j]);
  [state.categories[a], state.categories[b]] = [state.categories[b], state.categories[a]];
  save(); render(); openCategories();
}

function openCategoryForm(id) {
  const c = id ? catById(id) : null;
  const v = c || { name: '', emoji: '✨', color: 'lavender', part: 'day', cadence: { type: 'daily' }, rollover: true, notes: '' };
  const count = c ? state.tasks.filter(t => t.category === c.id).length : 0;
  const html = `<div class="sheet-top"><h2>${c ? 'Edit category' : 'New category'}</h2></div>
  <form data-form="category">
    <div class="title-field">
      <input class="input emoji-input" name="emoji" value="${esc(v.emoji)}" maxlength="8" aria-label="Icon">
      <input class="input" name="title" value="${esc(v.name)}" placeholder="e.g. Weekly chores" required autocomplete="off">
    </div>
    ${emojiGrid()}
    <div class="field"><span>Colour</span><div class="swatches">
      ${COLORS.map(col => `<label class="col-${col}" title="${col}"><input type="radio" name="color" value="${col}" ${v.color === col ? 'checked' : ''}></label>`).join('')}
    </div></div>
    <div class="field"><span>Part of day</span><div class="seg">
      ${PARTS.map(p => `<label><input type="radio" name="part" value="${p.id}" ${v.part === p.id ? 'checked' : ''}>${p.label}</label>`).join('')}
    </div></div>
    <p class="footnote" style="margin:0 0 8px">Default repeat for new tasks in this category:</p>
    ${cadenceFields(v.cadence, { allowDate: false })}
    <label class="toggle"><input type="checkbox" name="rollover" ${v.rollover ? 'checked' : ''}>
      <div>Carry over if not done<small>Default for new tasks in this category.</small></div></label>
    <label class="field"><span>Rules &amp; notes</span>
      <textarea class="tall" name="notes" placeholder="Shown when you tap the category heading.&#10;&#10;Lines starting with * become bullet points.&#10;A line above a list becomes a heading.">${esc(v.notes)}</textarea></label>
    ${count ? `<label class="toggle"><input type="checkbox" name="applyAll">
      <div>Also apply repeat &amp; carry-over to its ${count} existing task${count === 1 ? '' : 's'}<small>Leave off to keep their own schedules (e.g. Mon/Fri actives).</small></div></label>` : ''}
    <div class="actions">
      <button type="button" class="btn ghost" data-action="close">Cancel</button>
      <button type="submit" class="btn primary">${c ? 'Save' : 'Create'}</button>
      ${c ? `<button type="button" class="btn danger wide" data-action="cat-delete" data-cat="${c.id}">Delete category</button>` : ''}
    </div>
  </form>`;
  openSheet({ type: 'catform', id: id || null }, html);
  updateCadenceFields(sheetEl.querySelector('form'));
}

function saveCategoryForm(f) {
  const s = ui.sheet;
  const fd = new FormData(f);
  const name = String(fd.get('title') || '').trim();
  if (!name) { f.title.focus(); return; }
  const cadence = readCadence(fd);
  if (!cadence) return;
  const data = {
    name, emoji: String(fd.get('emoji') || '').trim() || '✨',
    color: fd.get('color') || 'grey', part: fd.get('part') || 'day',
    cadence, rollover: !!fd.get('rollover'), notes: String(fd.get('notes') || '').replace(/\s+$/, '')
  };
  let c = s.id ? catById(s.id) : null;
  if (c) {
    Object.assign(c, data);
    if (fd.get('applyAll')) {
      for (const t of state.tasks) {
        if (t.category !== c.id) continue;
        t.rollover = data.rollover;
        if (cadence.type === 'once') { t.cadence = { type: 'once', date: ui.date }; t.start = ui.date; }
        else t.cadence = clone(cadence);
      }
    }
  } else {
    c = Object.assign({ id: uid() }, data);
    state.categories.push(c);
  }
  save(); render();
  toast(s.id ? 'Category saved' : 'Category created');
  openCategory(c.id);
}

function deleteCategory(id) {
  if (state.categories.length <= 1) { toast('You need at least one category'); return; }
  const c = catById(id);
  const tasks = state.tasks.filter(t => t.category === id);
  const fallback = state.categories.find(x => x.id === 'other' && x.id !== id) || state.categories.find(x => x.id !== id);
  const msg = tasks.length
    ? `Delete “${c.name}”? Its ${tasks.length} task(s) will move to “${fallback.name}”.`
    : `Delete “${c.name}”?`;
  if (!confirm(msg)) return;
  tasks.forEach(t => { t.category = fallback.id; });
  state.categories = state.categories.filter(x => x.id !== id);
  delete state.collapsed[id];
  save(); render(); openCategories();
}

/* ---------- Library ---------- */
function libExists(item) {
  return state.tasks.some(t => t.title.toLowerCase() === item.title.toLowerCase());
}
function addFromLibrary(groupIds, itemIdx) {
  let n = 0;
  let order = state.tasks.length ? Math.max(...state.tasks.map(x => x.order)) + 1 : 0;
  for (const g of LIBRARY) {
    if (!groupIds.includes(g.id)) continue;
    g.items.forEach((item, i) => {
      if (itemIdx !== undefined && i !== itemIdx) return;
      if (libExists(item)) return;
      const t = makeTask(item);
      if (!catById(t.category)) t.category = catOf(t).id;
      t.order = order++;
      state.tasks.push(t);
      n++;
    });
  }
  save();
  render();
  if (n) toast(n === 1 ? 'Added 1 task' : `Added ${n} tasks`);
  if (ui.sheet && ui.sheet.type === 'library') openLibrary(true);
}

function openLibrary(keepScroll) {
  let html = `<div class="sheet-top"><h2>Routine library</h2><button class="small-btn" data-action="close">Done</button></div>
    <p class="footnote">Tap + to add a single task or “Add all” for a whole routine. You can edit times, days and checklists afterwards.</p>`;
  for (const g of LIBRARY) {
    const allIn = g.items.every(libExists);
    html += `<div class="lib-group"><div class="lib-head"><div><h3>${esc(g.title)}</h3><p>${esc(g.blurb)}</p></div>
      ${allIn ? '<span class="footnote">All added</span>' : `<button class="small-btn" data-action="lib-all" data-group="${g.id}">Add all</button>`}</div><div class="card">`;
    g.items.forEach((item, i) => {
      const added = libExists(item);
      const col = (catById(item.category) || {}).color || 'grey';
      html += `<div class="lib-row col-${col}"><span class="emoji">${item.emoji}</span>
        <div class="info"><div>${esc(item.title)}</div><small>${esc(cadenceText(item.cadence))}${item.duration ? ' · ' + item.duration + ' min' : ''}</small></div>
        ${added ? '<span class="add-btn added">✓</span>' : `<button class="add-btn" data-action="lib-one" data-group="${g.id}" data-idx="${i}" aria-label="Add">+</button>`}</div>`;
    });
    html += '</div></div>';
  }
  openSheet({ type: 'library', keepScroll: !!keepScroll }, html);
}

/* ---------- Menu ---------- */
function openMenu() {
  const html = `<div class="sheet-top"><h2>Menu</h2><button class="small-btn" data-action="close">Close</button></div>
    <div class="card">
      <button class="menu-item" data-action="m-cats"><span class="mi">🏷️</span>Categories — repeats, rules &amp; notes</button>
      <button class="menu-item" data-action="m-library"><span class="mi">📚</span>Routine library</button>
      <button class="menu-item" data-action="m-add"><span class="mi">➕</span>New task</button>
    </div>
    <div class="card">
      <button class="menu-item" data-action="m-export"><span class="mi">⬇️</span>Export backup</button>
      <button class="menu-item" data-action="m-import"><span class="mi">⬆️</span>Import backup</button>
      <button class="menu-item danger" data-action="m-reset"><span class="mi">🗑️</span>Erase everything</button>
    </div>
    <p class="footnote">Everything is saved in this browser on this device only. Export a backup now and then, or to move your routines to another device.</p>`;
  openSheet({ type: 'menu' }, html);
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `routines-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Backup downloaded');
}

$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.tasks)) throw new Error('bad file');
    if (!confirm(`Replace your current routines with this backup (${data.tasks.length} tasks)?`)) return;
    state = migrate(Object.assign(blankState(), data, { seededSkincare: true }));
    save(); closeSheet(); render(); toast('Backup restored');
  } catch (err) { toast('That file doesn’t look like a Routines backup'); }
});

/* ---------- Sheet event handling ---------- */
sheetEl.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  const s = ui.sheet || {};
  const o = s.type === 'detail' ? findOcc(s.id) : null;

  switch (a) {
    case 'close': closeSheet(); break;
    case 'pick-emoji': sheetEl.querySelector('[name=emoji]').value = el.dataset.emoji; break;
    case 'lib-all': addFromLibrary([el.dataset.group]); break;
    case 'lib-one': addFromLibrary([el.dataset.group], Number(el.dataset.idx)); break;
    case 'm-library': openLibrary(); break;
    case 'm-cats': openCategories(); break;
    case 'm-add': openForm(); break;
    case 'm-export': exportData(); break;
    case 'm-import': $('#importFile').click(); break;
    case 'm-reset':
      if (confirm('Erase all tasks, categories and history? This cannot be undone.')) {
        state = migrate(Object.assign(blankState(), { seededSkincare: true }));
        save(); closeSheet(); render();
      }
      break;

    case 'edit-task': openForm(el.dataset.id); break;
    case 'open-cat': openCategory(el.dataset.cat); break;
    case 'cat-add-task': openForm(null, el.dataset.cat); break;
    case 'cat-edit': openCategoryForm(el.dataset.cat); break;
    case 'cat-new': openCategoryForm(); break;
    case 'cat-up': moveCategory(el.dataset.cat, -1); break;
    case 'cat-down': moveCategory(el.dataset.cat, 1); break;
    case 'cat-delete': deleteCategory(el.dataset.cat); break;

    case 'toggle-done': if (o) { setDone(o, !o.done); render(); o.done ? openDetail(s.id) : closeSheet(); if (!o.done) toast('Nice one ✨'); } break;
    case 'timer':
      if (o) {
        if (state.timers[o.key]) delete state.timers[o.key];
        else state.timers[o.key] = { start: Date.now() };
        save(); render(); openDetail(s.id, true);
      }
      break;
    case 'skip':
      if (o) {
        if (o.skipped) delete state.skips[o.key]; else { state.skips[o.key] = true; delete state.timers[o.key]; }
        save(); render();
        if (findOcc(s.id)) openDetail(s.id, true); else closeSheet();
        if (!o.skipped) toast('Skipped');
      }
      break;
    case 'edit': openForm(s.id); break;
    case 'delete': {
      const t = taskById(s.id);
      if (t && confirm(`Delete “${t.title}” and its history?`)) { deleteTask(t.id); closeSheet(); render(); toast('Task deleted'); }
      break;
    }
    case 'check-item': {
      if (!o || e.target.closest('.x')) break;
      const c = state.checks[o.key] = state.checks[o.key] || {};
      const id = el.dataset.item;
      if (c[id]) delete c[id]; else c[id] = true;
      const all = o.task.checklist.length && o.task.checklist.every(i => c[i.id]);
      if (all && !o.done) { setDone(o, true); toast('All items ticked — task done ✨'); }
      save(); render(); openDetail(s.id, true);
      break;
    }
    case 'remove-item': {
      if (!o) break;
      o.task.checklist = o.task.checklist.filter(i => i.id !== el.dataset.item);
      save(); render(); openDetail(s.id, true);
      break;
    }
  }
});

sheetEl.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.dataset.form === 'task') saveTaskForm(f);
  if (f.dataset.form === 'category') saveCategoryForm(f);
  if (f.dataset.form === 'add-item') {
    const text = f.item.value.trim();
    const o = findOcc(ui.sheet.id);
    if (!text || !o) return;
    o.task.checklist.push({ id: uid(), text });
    save(); render(); openDetail(ui.sheet.id, true);
    setTimeout(() => { const i = sheetEl.querySelector('.cl-add input'); if (i) i.focus(); }, 0);
  }
});

sheetEl.addEventListener('change', e => {
  const f = e.target.form;
  if (!f) return;
  if (e.target.name === 'ctype') updateCadenceFields(f);
  if (f.dataset.form !== 'task') return;
  if (['ctype', 'days', 'every', 'mday', 'nthN', 'nthDay', 'date', 'rollover'].includes(e.target.name)) ui.sheet.touched = true;
  // New task: picking a category pulls in that category's default repeat & carry-over
  if (e.target.name === 'category' && !ui.sheet.touched) {
    const c = catById(e.target.value);
    if (c) {
      setCadenceInputs(f, c.cadence.type === 'once' ? { type: 'once', date: ui.date } : c.cadence);
      f.rollover.checked = !!c.rollover;
      if (state.categories.some(x => x.emoji === f.emoji.value)) f.emoji.value = c.emoji;
    }
  }
});

/* =========================================================
   Toast, timers, day change
   ========================================================= */
let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

setInterval(() => {
  const t0 = todayStr();
  if (t0 !== lastToday) {             // past midnight: follow "today" forward
    if (ui.date === lastToday) ui.date = t0;
    lastToday = t0;
    if (!drag) render();
    return;
  }
  if (!drag && Object.keys(state.timers).length) {
    renderList();
    if (ui.sheet && ui.sheet.type === 'detail') openDetail(ui.sheet.id, true);
  }
}, 15000);

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const t0 = todayStr();
  if (t0 !== lastToday) { if (ui.date === lastToday) ui.date = t0; lastToday = t0; }
  if (!drag) render();
});

render();
})();
</script>
</body>
</html>
