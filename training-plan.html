<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training Plan">
<title>16-Week Training Plan</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #1a1612;
    --card: #211d18;
    --card2: #261f19;
    --border: #2e2720;
    --muted: #7a6f62;
    --text: #ede5d8;
    --accent: #e8c547;
    --p1: #e8c547;
    --p2: #e87c47;
    --p3: #e84747;
    --green: #4ca868;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: #1a1612; color: var(--text); font-family: 'Barlow', sans-serif; min-height: 100vh; overscroll-behavior: none; }
  body { padding-bottom: 80px; }

  /* HEADER */
  .header { padding: 48px 20px 16px; border-bottom: 1px solid var(--border); background: #1a1612; }
  .header-eyebrow { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 0.22em; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
  .header-title { font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1; }
  .header-sub { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; color: var(--accent); margin-top: 4px; }

  /* BOTTOM NAV */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1e1a14; border-top: 1px solid var(--border); display: flex; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
  .nav-btn { flex: 1; padding: 12px 4px 10px; background: none; border: none; color: var(--muted); font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: color 0.2s; }
  .nav-btn.active { color: var(--accent); }
  .nav-btn svg { width: 20px; height: 20px; }

  /* TABS CONTENT */
  .tab { display: none; padding: 0 16px; }
  .tab.active { display: block; }

  /* PHASE PILLS */
  .phase-row { display: flex; gap: 8px; padding: 16px 0 12px; overflow-x: auto; scrollbar-width: none; }
  .phase-row::-webkit-scrollbar { display: none; }
  .phase-pill { flex-shrink: 0; padding: 10px 16px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--muted); font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; text-align: left; }
  .phase-pill span { display: block; font-size: 9px; font-weight: 400; margin-top: 2px; opacity: 0.6; }
  .phase-pill.active { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 15%, transparent); color: var(--pc); }

  /* PHASE INFO */
  .phase-info { background: var(--card); border-left: 3px solid var(--pc); border-radius: 0 6px 6px 0; padding: 14px 16px; margin-bottom: 16px; }
  .phase-info-label { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pc); margin-bottom: 6px; }
  .phase-info p { font-size: 13px; color: var(--text); line-height: 1.6; opacity: 0.82; margin-bottom: 10px; }
  .target-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .target-pill { background: color-mix(in srgb, var(--pc) 15%, transparent); border: 1px solid color-mix(in srgb, var(--pc) 40%, transparent); color: var(--pc); padding: 3px 10px; border-radius: 4px; font-size: 10px; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.04em; }

  /* DAY SELECTOR */
  .day-row { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; }
  .day-row::-webkit-scrollbar { display: none; }
  .day-btn { flex-shrink: 0; padding: 10px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--muted); font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; text-align: center; min-width: 80px; }
  .day-btn span { display: block; font-size: 9px; font-weight: 400; margin-top: 2px; opacity: 0.6; }
  .day-btn.active { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 15%, transparent); color: var(--pc); }

  /* SECTION TOGGLE */
  .section-toggle { display: flex; gap: 6px; margin-bottom: 16px; }
  .sec-btn { padding: 7px 12px; border-radius: 4px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; flex: 1; text-align: center; }
  .sec-btn.active { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 15%, transparent); color: var(--pc); }

  /* EXERCISE CARD */
  .ex-block-label { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--pc); margin-bottom: 10px; }
  .ex-card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 14px; margin-bottom: 8px; }
  .ex-name { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text); margin-bottom: 8px; }
  .ex-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .ex-tag { background: color-mix(in srgb, var(--pc) 12%, transparent); border: 1px solid color-mix(in srgb, var(--pc) 30%, transparent); border-radius: 4px; padding: 3px 10px; text-align: center; }
  .ex-tag-label { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--pc); opacity: 0.7; }
  .ex-tag-val { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; color: var(--pc); }
  .ex-tag.rest { background: color-mix(in srgb, #555 12%, transparent); border-color: color-mix(in srgb, #555 30%, transparent); }
  .ex-tag.rest .ex-tag-label, .ex-tag.rest .ex-tag-val { color: #8a7a6a; }
  .ex-load { font-size: 11px; color: var(--pc); font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.05em; margin-bottom: 4px; }
  .ex-notes { font-size: 12px; color: #7a6a58; line-height: 1.55; }

  /* WEEKLY SCHEDULE */
  .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 12px 0 8px; }
  .week-cell { text-align: center; padding: 8px 2px; border-radius: 4px; }
  .week-cell.on { background: color-mix(in srgb, var(--pc) 15%, transparent); border: 1px solid color-mix(in srgb, var(--pc) 40%, transparent); }
  .week-cell.off { background: #141008; border: 1px solid var(--border); }
  .week-day { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; }
  .week-cell.on .week-day { color: var(--pc); }
  .week-cell.off .week-day { color: var(--muted); }
  .week-label { font-size: 8px; line-height: 1.2; margin-top: 2px; }
  .week-cell.on .week-label { color: var(--text); opacity: 0.7; }
  .week-cell.off .week-label { color: var(--muted); opacity: 0.4; }

  /* INFO CARD */
  .info-card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; margin-bottom: 10px; }
  .info-card-label { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .info-card-val { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .info-card-detail { font-size: 13px; color: var(--muted); line-height: 1.6; }

  /* SAFETY */
  .safety-card { background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; padding: 14px 16px; margin-bottom: 8px; display: flex; gap: 12px; align-items: flex-start; }
  .safety-num { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 800; color: var(--accent); line-height: 1; min-width: 24px; }
  .safety-text { font-size: 13px; color: var(--text); line-height: 1.6; opacity: 0.85; }

  /* MOBILITY */
  .mob-card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .mob-name { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
  .mob-notes { font-size: 12px; color: #7a6a58; line-height: 1.5; }
  .mob-dur { text-align: right; flex-shrink: 0; }
  .mob-dur-val { color: var(--accent); font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700; }
  .mob-reps { font-size: 10px; color: var(--muted); margin-top: 2px; }

  /* NUTRITION MEAL */
  .meal-row { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .meal-row:last-child { border-bottom: none; }
  .meal-name { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--accent); letter-spacing: 0.04em; min-width: 90px; padding-top: 1px; }
  .meal-content { flex: 1; font-size: 12px; color: var(--text); opacity: 0.8; line-height: 1.5; }
  .meal-kcal { font-size: 10px; color: var(--muted); white-space: nowrap; padding-top: 2px; }

  /* GREEN BOX */
  .green-box { background: #0f1a10; border: 1px solid #1a3a22; border-radius: 6px; padding: 14px 16px; margin-top: 16px; }
  .green-box-label { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 0.14em; color: var(--green); text-transform: uppercase; margin-bottom: 6px; }
  .green-box p { font-size: 13px; color: #a0c8a8; line-height: 1.6; }

  /* SECTION HEADING */
  .sec-heading { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; margin: 20px 0 6px; }
  .sec-sub { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 18px; }

  .deload-note { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .deload-note span { color: var(--pc); }
</style>
</head>
<body>

<div class="header">
  <div class="header-eyebrow">16-Week Programme</div>
  <div class="header-title">Mass &amp; Strength</div>
  <div class="header-sub">Posterior Chain · Trunk · Mobility</div>
</div>

<!-- TABS -->
<div id="tab-plan" class="tab active"></div>
<div id="tab-mobility" class="tab"></div>
<div id="tab-nutrition" class="tab"></div>
<div id="tab-calendar" class="tab"></div>
<div id="tab-safety" class="tab"></div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-btn active" onclick="switchTab('plan',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
    Plan
  </button>
  <button class="nav-btn" onclick="switchTab('mobility',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    Mobility
  </button>
  <button class="nav-btn" onclick="switchTab('nutrition',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
    Nutrition
  </button>
  <button class="nav-btn" onclick="switchTab('calendar',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Calendar
  </button>
  <button class="nav-btn" onclick="switchTab('safety',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    Safety
  </button>
</nav>

<script>
const PHASE_COLORS = ['#e8c547','#e87c47','#e84747'];

const data = {
  phases: [
    {
      name:'Phase 1', subtitle:'Foundation & Movement', weeks:'Weeks 1–4',
      desc:'Build movement patterns, activate posterior chain, establish mobility baseline. No ego lifting — perfect the hinge, squat, and brace.',
      targets:['Hip hinge with flat back','Goblet squat to parallel','Rack pull 1.0× bodyweight','Hip thrust 1.25× bodyweight'],
      days:[
        {
          id:'A', label:'Lower A', tag:'Quads + Glutes',
          warmup:{ dur:'15 min', exs:[
            {n:'Deep Squat Hold (assisted)',r:'3 × 60 sec',notes:'Hold doorframe or TRX. Chest up, knees out.'},
            {n:'90/90 Hip Switch',r:'2 × 10 switches',notes:'Slow and controlled, feel each hip position.'},
            {n:'Ankle Wall Stretch',r:'2 × 45 sec each side',notes:'Knee drives over 4th toe. Critical for squat depth.'},
            {n:'Glute Bridge',r:'2 × 15 reps',notes:'Squeeze hard at top. Activate glutes before loading.'},
          ]},
          workout:[
            {n:'Goblet Squat',s:'4',r:'8–10',rest:'90s',load:'Moderate — form first',notes:'Elbows inside knees. Sit INTO the squat. Full depth if possible.'},
            {n:'Romanian Deadlift (RDL)',s:'4',r:'8–10',rest:'2 min',load:'Moderate',notes:'Push hips back, slight knee bend. Feel hamstring stretch. Bar stays close.'},
            {n:'Leg Press',s:'3',r:'12–15',rest:'90s',load:'Challenging but controlled',notes:'High foot placement = more glutes/hams. Don\'t lock knees.'},
            {n:'Hip Thrust',s:'4',r:'10–12',rest:'90s',load:'Heavy — this can go up fast',notes:'Drive through heels. Full hip extension. Squeeze 1 sec at top.'},
            {n:'Walking Lunge',s:'3',r:'10 each leg',rest:'60s',load:'Bodyweight or light DBs',notes:'Back knee nearly touches floor. Torso upright.'},
          ],
          cooldown:{ dur:'10 min', exs:[
            {n:'Hip Flexor Lunge Stretch',r:'2 × 90 sec each side',notes:'Tuck pelvis under. Feel front of hip open.'},
            {n:'Seated Hamstring Stretch',r:'2 × 90 sec each side',notes:'Don\'t round the back — hinge at hip.'},
            {n:'Pigeon Pose / Figure-4',r:'2 × 90 sec each side',notes:'External hip rotation. Breathe deeply into the stretch.'},
          ]}
        },
        {
          id:'B', label:'Upper', tag:'Back + Shoulders + Arms',
          warmup:{ dur:'10 min', exs:[
            {n:'Cat-Cow',r:'2 × 10 slow reps',notes:'Move each vertebra intentionally.'},
            {n:'Wall Angels',r:'3 × 10 reps',notes:'Full contact: head, upper back, sacrum. Slow.'},
            {n:'Band Pull-Apart',r:'3 × 15 reps',notes:'Squeeze shoulder blades together. Elbows soft.'},
            {n:'Arm Circles + Shoulder CARs',r:'2 × 10 each direction',notes:'Full range rotations. Controlled.'},
          ]},
          workout:[

            {n:'Lat Pulldown',s:'3',r:'10–12',rest:'90s',load:'Moderate-heavy',notes:'Full stretch at top. Pull to collarbone. Don\'t lean back excessively.'},
            {n:'Seated Cable Row',s:'3',r:'10–12',rest:'90s',load:'Moderate-heavy',notes:'Tall spine. Drive elbows back. Hold 1 sec at contraction.'},
            {n:'Overhead Press (DB or BB)',s:'4',r:'8–10',rest:'90s',load:'Moderate',notes:'Brace core. Don\'t flare ribs. Full lockout.'},
            {n:'Face Pull',s:'3',r:'15–20',rest:'60s',load:'Light-moderate',notes:'Rope to forehead level. External rotation. Crucial for shoulder health.'},
            {n:'Barbell/EZ Curl',s:'3',r:'10–12',rest:'60s',load:'Moderate',notes:'No swinging. Full range.'},
          ],
          cooldown:{ dur:'8 min', exs:[
            {n:'Thoracic Foam Roll',r:'1 × 3 min',notes:'Slow. Pause on tight spots. Arms crossed on chest.'},
            {n:'Doorway Chest Stretch',r:'2 × 60 sec',notes:'Feel the pec and front shoulder stretch.'},
            {n:'Child\'s Pose (lat stretch)',r:'2 × 60 sec',notes:'Walk hands to each side to bias each lat.'},
          ]}
        },
        {
          id:'C', label:'Lower B', tag:'Posterior Chain Heavy',
          warmup:{ dur:'15 min', exs:[

            {n:'Leg Swing (front/back + lateral)',r:'2 × 15 each',notes:'Dynamic. Hold wall. Increasing range each rep.'},
            {n:'Good Morning (bodyweight)',r:'3 × 10 reps',notes:'Hinge from hip. Soft knee. Flat back. Rehearsal for deadlift.'},

          ]},
          workout:[
            {n:'Rack Pull (from knee height)',s:'5',r:'4–6',rest:'2–3 min',load:'HEAVY — main strength driver Phase 1',notes:'Brace like you\'re about to get punched. Push floor away. Bar drags up shins.'},
            {n:'Bulgarian Split Squat',s:'4',r:'8 each leg',rest:'2 min',load:'Moderate — humbling but essential',notes:'Rear foot on bench. Vertical shin. 3 sec descent.'},

          ],
          cooldown:{ dur:'12 min', exs:[
            {n:'90/90 Hip Stretch (passive hold)',r:'2 × 2 min each side',notes:'Settle into it. Don\'t force. Let gravity do the work.'},

        {

          warmup:{ dur:'10 min', exs:[

            {n:'Tricep Pushdown (cable)',s:'3',r:'12–15',rest:'60s',load:'Moderate',notes:'Elbows fixed at sides. Full extension.'},

    {

        {

            {n:'Hip CARs',r:'2 × 5 each side',notes:'Slow full-range hip circles. Own every degree.'},
            {n:'Box Squat (bodyweight)',r:'3 × 10',notes:'Sit back to box, pause, drive up. Rehearsal for squat.'},

          workout:[
            {n:'Back Squat',s:'5',r:'5',rest:'3 min',load:'HEAVY — 5×5 is your strength driver',notes:'Belt when above ~80% 1RM. Brace hard. Sit into it. Drive knees out.'},
            {n:'Front Squat or Hack Squat',s:'3',r:'8–10',rest:'2 min',load:'Moderate',notes:'More quad focus. Upright torso.'},
            {n:'Hip Thrust',s:'4',r:'8–10',rest:'90s',load:'Heavy and increasing',notes:'Progress every session if possible.'},
            {n:'Leg Press',s:'3',r:'10–15',rest:'90s',load:'Heavy',notes:'Volume accumulation. Push the quad work.'},
            {n:'Calf Raise',s:'4',r:'15–20',rest:'60s',load:'Moderate-heavy',notes:'Slow and controlled. Full stretch.'},
          ],
          cooldown:{ dur:'12 min', exs:[

        {
          id:'B', label:'Upper', tag:'Back Thickness',

  mobilityCore:{
    title:'Core Bracing — The 360° Technique',
    note:'This is a skill, not an exercise. Learning this correctly is what separates people who get hurt lifting heavy from people who don\'t. Practice it every session before any loaded work.',
    steps:[
      {n:'Step 1: Find neutral spine',detail:'Stand tall. Tilt pelvis forward and back slightly. Find the midpoint — neither fully anterior nor posterior tilted. This is neutral. This is where you lift from.'},
      {n:'Step 2: Big breath into your belly',detail:'Breathe deep through your nose — push your belly OUT, not up. Your chest should barely move. You\'re filling the space around your spine with air pressure, not lifting your chest.'},
      {n:'Step 3: 360° brace',detail:'With air in your belly, brace as if you\'re about to get punched from all sides — front, back, and sides simultaneously. Your whole trunk should feel rigid. This is intra-abdominal pressure.'},
      {n:'Step 4: Hold through the lift',detail:'Hold this brace through the hardest part of the movement. Exhale at the top or on the way up, never at the bottom or initiation. For very heavy singles, you can hold the whole rep.'},
      {n:'Step 5: Practice daily',detail:'Practise the brace standing, then in a hip hinge, then in a squat pattern, before you add any weight. It should feel automatic within 2 weeks.'},
    ],
    drill:{n:'Brace Drill (do before every session)',sets:'3 × 5 reps',detail:'Stand or sit. Take a big belly breath, brace hard, hold 5 seconds, release. Repeat. Teaches the nervous system the pattern before loading it.'}
  },

let currentPhase = 0, currentDay = 0, currentSection = 'workout';

function pc() { return PHASE_COLORS[currentPhase]; }

function switchTab(id, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
}

function setPhase(i) {
  currentPhase = i; currentDay = 0; currentSection = 'workout';
  renderPlan();
}

function setDay(i) {
  currentDay = i; currentSection = 'workout';
  renderPlan();
}

function setSection(s) {
  currentSection = s;
  renderPlan();
}

function tagHTML(label, val, muted) {
  const c = muted ? '#777' : pc();
  const bg = muted ? 'rgba(85,85,85,0.12)' : `color-mix(in srgb, ${pc()} 12%, transparent)`;
  const border = muted ? 'rgba(85,85,85,0.3)' : `color-mix(in srgb, ${pc()} 30%, transparent)`;
  return `<div style="background:${bg};border:1px solid ${border};border-radius:4px;padding:3px 10px;text-align:center;">
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:${c};opacity:0.7;">${label}</div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:${c};">${val}</div>
  </div>`;
}

function exCardHTML(ex, isWarmup, isCooldown) {
  let tags = '';
  if (!isWarmup && !isCooldown) {
    tags += tagHTML('Sets', ex.s, false);
    tags += tagHTML('Reps', ex.r, false);
    tags += tagHTML('Rest', ex.rest, true);
  } else {
    tags += tagHTML('Duration', ex.r, false);
  }
  return `<div class="ex-card">
    <div class="ex-name">${ex.n}</div>
    <div class="ex-tags">${tags}</div>
    ${ex.load && !isWarmup && !isCooldown ? `<div class="ex-load">⚡ ${ex.load}</div>` : ''}
    ${ex.notes ? `<div class="ex-notes">${ex.notes}</div>` : ''}
  </div>`;
}

function renderPlan() {
  const phase = data.phases[currentPhase];
  const day = phase.days[currentDay];
  const color = pc();

  // Phase pills
  let phasePills = data.phases.map((p,i) => `
    <button class="phase-pill ${i===currentPhase?'active':''}" style="${i===currentPhase?`--pc:${PHASE_COLORS[i]};border-color:${PHASE_COLORS[i]};background:color-mix(in srgb,${PHASE_COLORS[i]} 15%,transparent);color:${PHASE_COLORS[i]};`:`border-color:var(--border);color:var(--muted);`}" onclick="setPhase(${i})">
      ${p.name}: ${p.subtitle}<span>${p.weeks}</span>
    </button>`).join('');

  // Phase info
  let phaseInfo = `<div class="phase-info" style="--pc:${color};border-left-color:${color};">
    <div class="phase-info-label" style="color:${color};">Phase Goal</div>
    <p>${phase.desc}</p>
    <div class="target-pills">${phase.targets.map(t=>`<span class="target-pill" style="background:color-mix(in srgb,${color} 15%,transparent);border-color:color-mix(in srgb,${color} 40%,transparent);color:${color};">✓ ${t}</span>`).join('')}</div>
  </div>`;

  // Day buttons
  let dayBtns = phase.days.map((d,i) => `
    <button class="day-btn ${i===currentDay?'active':''}" style="${i===currentDay?`border-color:${color};background:color-mix(in srgb,${color} 15%,transparent);color:${color};`:''}" onclick="setDay(${i})">
      Day ${d.id}: ${d.label}<span>${d.tag}</span>
    </button>`).join('');

  // Section toggle
  const secs = [{id:'warmup',label:`Warm-Up (${day.warmup.dur})`},{id:'workout',label:'Main Workout'},{id:'cooldown',label:`Cooldown (${day.cooldown.dur})`}];
  let secBtns = secs.map(s=>`<button class="sec-btn ${s.id===currentSection?'active':''}" style="${s.id===currentSection?`border-color:${color};background:color-mix(in srgb,${color} 15%,transparent);color:${color};`:''}" onclick="setSection('${s.id}')">${s.label}</button>`).join('');

  // Exercises
  let exHTML = '';
  if (currentSection === 'warmup') {
    exHTML = `<div class="ex-block-label" style="color:${color};">Warm-Up</div>` + day.warmup.exs.map(e=>exCardHTML(e,true,false)).join('');
  } else if (currentSection === 'workout') {
    exHTML = `<div class="ex-block-label" style="color:${color};">Main Workout</div>` + day.workout.map(e=>exCardHTML(e,false,false)).join('');
  } else {
    exHTML = `<div class="ex-block-label" style="color:${color};">Cooldown</div>` + day.cooldown.exs.map(e=>exCardHTML(e,false,true)).join('');
  }

  // Weekly grid
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const labels = ['Lower A','Upper A','Rest','Lower B','Upper B','Rest','Rest'];
  const active = [0,1,3,4];
  let weekGrid = days.map((d,i)=>`
    <div class="week-cell ${active.includes(i)?'on':'off'}" style="${active.includes(i)?`background:color-mix(in srgb,${color} 15%,transparent);border-color:color-mix(in srgb,${color} 40%,transparent);`:''}" >
      <div class="week-day" style="${active.includes(i)?`color:${color};`:''}">${d}</div>
      <div class="week-label">${labels[i]}</div>
    </div>`).join('');

  document.getElementById('tab-plan').innerHTML = `
    <div class="phase-row">${phasePills}</div>
    ${phaseInfo}
    <div class="day-row">${dayBtns}</div>
    <div class="section-toggle">${secBtns}</div>
    ${exHTML}
    <div class="info-card" style="margin-top:20px;">
      <div class="info-card-label">Weekly Schedule</div>
      <div class="week-grid">${weekGrid}</div>
      <div class="deload-note">Every 4th week: <span style="color:${color};">Deload</span> — reduce all sets by 40%, keep weight the same.</div>
    </div>
    <div style="height:8px;"></div>
  `;
}

            <div style="font-size:12px;color:var(--muted);line-height:1.6;">${s.detail}</div>
          </div>
        </div>`).join('')}
      <div style="background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:6px;padding:13px 14px;margin-top:4px;">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:var(--accent);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px;">${c.drill.n} · ${c.drill.sets}</div>
        <div style="font-size:12px;color:var(--muted);line-height:1.6;">${c.drill.detail}</div>
      </div>`;
  }

  document.getElementById('tab-mobility').innerHTML = `
    <div style="padding:16px 0 12px;">
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">Mobility</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:14px;">Progressive · Posture · Core · Daily + 2× Weekly</div>
      <div style="display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;">${subBtns}</div>
    </div>
    ${content}
    <div style="height:8px;"></div>
  `;
}

function setMobPhase(i) { mobPhase = i; renderMobility(); }

// ── CALENDAR (Static Template) ──────────────────────────────────────────────

function renderCalendar() {
  var weekDays = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var weekLabels = ['Lower A','Upper A','Rest','Lower B','Upper B','Mobility','Rest'];
  var weekTypes  = ['gym','gym','rest','gym','gym','mob','rest'];
  var weekColors = ['#e8c547','#e87c47','#3a3530','#e8c547','#e87c47','#4ca868','#3a3530'];

  var phases = [
    {name:'Phase 1', label:'Foundation & Movement', weeks:'Weeks 1–4',  color:'#e8c547', deload:4,  wStart:1,  wEnd:4,  focus:'Rack pulls, goblet squats, hip thrusts. Building the movement patterns.'},
    {name:'Phase 2', label:'Load & Build',           weeks:'Weeks 5–10', color:'#e87c47', deload:8,  wStart:5,  wEnd:10, focus:'Conventional deadlift and back squat introduced. 5x5 on main lifts.'},
    {name:'Phase 3', label:'Strength & Mass',        weeks:'Weeks 11–16',color:'#e84747', deload:16, wStart:11, wEnd:16, focus:'Wave loading, heavy singles, rack pull overload. Peak strength.'},
  ];

  function dayBadge(i, isDeload) {
    var t = weekTypes[i], c = weekColors[i], lbl = weekLabels[i].split(' ')[0];
    var bg = t==='rest' ? 'rgba(255,255,255,0.03)' : t==='gym' ? 'rgba(232,197,71,0.1)' : 'rgba(76,168,104,0.1)';
    if (t==='gym' && c==='#e87c47') bg = 'rgba(232,124,71,0.1)';
    var border = t==='rest' ? '#2e2720' : (t==='gym' ? 'rgba(232,197,71,0.25)' : 'rgba(76,168,104,0.25)');
    if (t==='gym' && c==='#e87c47') border = 'rgba(232,124,71,0.25)';
    var textColor = t==='rest' ? '#3a3530' : c;
    if (isDeload && t!=='rest') { bg='rgba(122,154,122,0.1)'; border='rgba(122,154,122,0.25)'; textColor='#7a9a7a'; lbl=lbl; }
    return '<div style="text-align:center;padding:6px 2px;border-radius:5px;background:'+bg+';border:1px solid '+border+';">'
      +'<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:9px;font-weight:700;color:#7a6f62;letter-spacing:0.06em;">'+weekDays[i]+'</div>'
      +'<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:8px;font-weight:700;color:'+textColor+';margin-top:2px;line-height:1.2;">'+lbl+'</div>'
      +'</div>';
  }

  function weekRow(wNum, phaseColor, isDeload) {
    var badges = '';
    for (var i=0; i<7; i++) badges += dayBadge(i, isDeload);
    var wLabel = isDeload
      ? '<span style="color:#7a9a7a;">WK '+wNum+' <span style="font-size:9px;">DELOAD</span></span>'
      : '<span style="color:'+phaseColor+';">WK '+wNum+'</span>';
    return '<div style="margin-bottom:8px;">'
      +'<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:11px;font-weight:700;margin-bottom:4px;">'+wLabel+'</div>'
      +'<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;">'+badges+'</div>'
      +'</div>';
  }

  var phaseHTML = '';
  for (var pi=0; pi<phases.length; pi++) {
    var p = phases[pi];
    var rows = '';
    for (var w=p.wStart; w<=p.wEnd; w++) rows += weekRow(w, p.color, w===p.deload);
    phaseHTML += '<div style="margin-bottom:22px;">'
      +'<div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-left:3px solid '+p.color+';border-radius:0 8px 8px 0;padding:13px 16px;margin-bottom:12px;">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">'
      +'<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:15px;font-weight:800;text-transform:uppercase;color:'+p.color+';">'+p.name+': '+p.label+'</div>'
      +'<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:10px;color:'+p.color+';opacity:0.8;">'+p.weeks+'</div>'
      +'</div>'
      +'<div style="font-size:12px;color:#7a6f62;line-height:1.6;">'+p.focus+'</div>'
      +'</div>'
      +rows
      +'</div>';
  }

  var legend = '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;">'
    +[['#e8c547','Lower Day'],['#e87c47','Upper Day'],['#4ca868','Mobility'],['#3a3530','Rest']].map(function(x){
      return '<div style="display:flex;align-items:center;gap:5px;">'
        +'<div style="width:9px;height:9px;border-radius:2px;background:'+x[0]+';opacity:0.9;"></div>'
        +'<span style="font-family:\'Barlow Condensed\',sans-serif;font-size:11px;color:#7a6f62;">'+x[1]+'</span>'
        +'</div>';
    }).join('')+'</div>';

  var missedNote = '<div style="background:rgba(232,197,71,0.07);border:1px solid rgba(232,197,71,0.2);border-radius:6px;padding:14px 16px;margin-bottom:18px;">'
    +'<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:11px;font-weight:700;color:#e8c547;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px;">If You Miss a Session</div>'
    +'<div style="font-size:13px;color:#7a6f62;line-height:1.75;">'
    +'Slide everything forward by one day — the order never changes.<br>'
    +'<strong style="color:#ede5d8;">Miss Monday Lower A?</strong> Do it Tuesday, push Upper A to Wednesday.<br>'
    +'<strong style="color:#ede5d8;">Miss a full week?</strong> Pick up exactly where you left off. Never skip ahead.<br>'
    +'<strong style="color:#ede5d8;">Deload week?</strong> Still do it — it\'s recovery, not optional.'
    +'</div></div>';

  document.getElementById('tab-calendar').innerHTML =
    '<div style="padding:16px 0 12px;">'
    +'<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">16-Week Schedule</div>'
    +'<div style="font-size:13px;color:#7a6f62;margin-bottom:14px;">Your full programme at a glance. Missed sessions slide forward.</div>'
    +'</div>'
    +missedNote
    +legend
    +phaseHTML
    +'<div style="height:8px;"></div>';
}


function renderSafety() {
  const cards = data.safety.map((r,i)=>`
    <div class="safety-card">
      <div class="safety-num">${String(i+1).padStart(2,'0')}</div>
      <div class="safety-text">${r}</div>
    </div>`).join('');

  document.getElementById('tab-safety').innerHTML = `
    <div class="sec-heading">Safety Rules</div>
    <div class="sec-sub">Heavy lifting rewards those who stay consistent. Injury breaks consistency. These are non-negotiable.</div>
    ${cards}
    <div style="height:8px;"></div>
  `;
}

let nutTab = 'schedule';

function renderNutrition() {
  var subTabs = [
    {id:'schedule',label:'Day Plan'},
    {id:'breakfast',label:'Breakfast'},
    {id:'lunch',label:'Lunch'},
    {id:'dinner',label:'Dinner'},
    {id:'snacks',label:'Snacks'},
    {id:'macros',label:'Macros'},
    {id:'shopping',label:'Shopping'},
  ];

  var subBtns = subTabs.map(function(t) {
    var active = nutTab === t.id;
    return '<button onclick="nutTab=\''+t.id+'\';renderNutrition();" style="'
      +'flex-shrink:0;padding:8px 14px;border-radius:20px;'
      +'border:1px solid '+(active?'var(--accent)':'var(--border)')+';'
      +'background:'+(active?'rgba(232,197,71,0.15)':'var(--card)')+';'
      +'color:'+(active?'var(--accent)':'var(--muted)')+';'
      +'font-family:\'Barlow Condensed\',sans-serif;font-size:12px;font-weight:700;'
      +'letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap;">'
      +t.label+'</button>';
  }).join('');

  var content = '';

  if (nutTab === 'schedule') {
    content = '<div style="margin-bottom:14px;"><div style="font-size:13px;color:var(--muted);line-height:1.6;">Training days: gym at 7am. Here\'s how to structure eating around it.</div></div>'
      + data.trainingDaySchedule.map(function(s) {
        return '<div style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:14px;margin-bottom:8px;display:flex;gap:14px;align-items:flex-start;">'
          +'<div style="text-align:center;min-width:52px;flex-shrink:0;">'
          +'<div style="font-size:18px;margin-bottom:2px;">'+s.emoji+'</div>'
          +'<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:11px;font-weight:700;color:var(--accent);">'+s.time+'</div>'
          +'</div>'
          +'<div style="flex:1;">'
          +'<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:3px;">'+s.label+'</div>'
          +'<div style="font-size:12px;color:var(--muted);line-height:1.55;">'+s.desc+'</div>'
          +(s.kcal?'<div style="font-size:11px;color:var(--accent);margin-top:4px;font-family:\'Barlow Condensed\',sans-serif;">'+s.kcal+'</div>':'')
          +'</div></div>';
      }).join('');
  }

  function mealCards(arr) {
    return arr.map(function(m) {
      return '<div style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:14px;margin-bottom:10px;">'
        +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;flex-wrap:wrap;">'
        +'<div><div style="font-family:\'Barlow Condensed\',sans-serif;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;">'+m.name+'</div>'
        +'<div style="font-size:10px;color:var(--muted);margin-top:2px;font-family:\'Barlow Condensed\',sans-serif;letter-spacing:0.06em;">'+m.tag+'</div></div>'
        +'<div style="text-align:right;flex-shrink:0;">'
        +'<div style="font-size:11px;color:var(--accent);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;">'+m.kcal+'</div>'
        +'<div style="font-size:10px;color:var(--muted);margin-top:1px;">'+m.office+(m.time?' · '+m.time:'')+'</div>'
        +'</div></div>'
        +'<ul style="margin:8px 0;padding-left:16px;">'+m.items.map(function(i){return '<li style="font-size:12px;color:var(--text);opacity:0.8;line-height:1.7;">'+i+'</li>';}).join('')+'</ul>'
        +'<div style="background:rgba(232,197,71,0.08);border-left:2px solid var(--accent);padding:8px 10px;border-radius:0 4px 4px 0;margin-top:8px;">'
        +'<div style="font-size:11px;color:var(--muted);font-style:italic;line-height:1.55;">💡 '+m.tip+'</div></div>'
        +'</div>';
    }).join('');
  }

  if (nutTab === 'breakfast') content = mealCards(data.breakfasts);
  if (nutTab === 'lunch')     content = mealCards(data.lunches);
  if (nutTab === 'dinner')    content = mealCards(data.dinners);

  if (nutTab === 'snacks') {
    content = data.snacks.map(function(block) {
      return '<div style="margin-bottom:20px;">'
        +'<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;">'+block.time+'</div>'
        +block.items.map(function(s){
          return '<div style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:12px 14px;margin-bottom:7px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;">'
            +'<div style="flex:1;"><div style="font-family:\'Barlow Condensed\',sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;">'+s.n+'</div>'
            +'<div style="font-size:11px;color:var(--muted);margin-top:2px;">'+s.easy+'</div></div>'
            +'<div style="font-size:11px;color:var(--accent);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;text-align:right;flex-shrink:0;">'+s.k+'</div>'
            +'</div>';
        }).join('')+'</div>';
    }).join('');
  }

  if (nutTab === 'macros') {
    content = '<div style="margin-bottom:14px;font-size:13px;color:var(--muted);line-height:1.6;">The framework everything else is built around.</div>'
      +data.nutrition.map(function(n){
        return '<div class="info-card"><div class="info-card-label">'+n.label+'</div><div class="info-card-val">'+n.val+'</div><div class="info-card-detail">'+n.detail+'</div></div>';
      }).join('');
  }

  if (nutTab === 'shopping') {
    content = '<div style="margin-bottom:14px;font-size:13px;color:var(--muted);line-height:1.6;">Weekly shop covering all meals in this plan.</div>'
      +data.shopping.map(function(cat){
        return '<div style="margin-bottom:16px;">'
          +'<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;">'+cat.emoji+' '+cat.cat+'</div>'
          +cat.items.map(function(item){
            return '<div style="display:flex;align-items:flex-start;gap:10px;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:5px;margin-bottom:5px;">'
              +'<div style="width:16px;height:16px;border:1.5px solid var(--border);border-radius:3px;flex-shrink:0;margin-top:1px;"></div>'
              +'<div style="font-size:13px;color:var(--text);opacity:0.85;line-height:1.5;">'+item+'</div></div>';
          }).join('')+'</div>';
      }).join('');
  }

  document.getElementById('tab-nutrition').innerHTML =
    '<div style="padding:16px 0 12px;">'
    +'<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">Nutrition</div>'
    +'<div style="font-size:13px;color:var(--muted);margin-bottom:14px;">Office-friendly · No fish · 7am gym start</div>'
    +'<div style="display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;">'+subBtns+'</div>'
    +'</div>'
    +content
    +'<div style="height:8px;"></div>';
}

// ── INIT ─────────────────────────────────────────────────────────────────────
renderPlan();
renderMobility();
renderNutrition();
renderCalendar();
renderSafety();
</script>
</body>
</html>
